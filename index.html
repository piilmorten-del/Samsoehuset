  font-size: 11px;

<body>
<!-- resten af HTML er uændret -->

<script>
/* ===== kun relevant JS-ændring ===== */

function renderShiftDayPill(from, to, colorClass){
  const p = document.createElement("div");
  p.className = "pill shiftday " + colorClass;
  p.textContent = `Skifte: ${from} → ${to}`;
  p.title = `Skifte: ${from} → ${to}`;
  return p;
}

/* alle andre funktioner uændrede */
</script>
