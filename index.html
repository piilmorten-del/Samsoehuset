<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Samsøhuset</title>

  <style>
    :root{
      --bg:#0b0f14;
      --card: rgba(15,18,22,.78);
      --stroke: rgba(255,255,255,.10);
      --stroke2: rgba(255,255,255,.16);
      --text:#f3f5f7;
      --muted: rgba(255,255,255,.70);
      --muted2: rgba(255,255,255,.55);
      --green:#2dd47a;
      --blue:#4aa6ff;
      --purple:#b77bff;
      --teal:#3ee6c3;
      --orange:#ffb55e;
      --shadow: 0 18px 50px rgba(0,0,0,.55);
      --r: 18px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; margin:0; }
    body{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      overflow-x: hidden;
    }

    .bg{
      position:fixed; inset:0;
      background-image: url("bg.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: saturate(1.05) contrast(1.05);
      transform: scale(1.02);
    }
    .bg::after{
      content:"";
      position:absolute; inset:0;
      background: radial-gradient(1000px 700px at 25% 15%, rgba(0,0,0,.25), rgba(0,0,0,.75)),
                  linear-gradient(180deg, rgba(0,0,0,.40), rgba(0,0,0,.70));
    }

    .wrap{
      position:relative;
      min-height:100%;
      padding: 22px 22px 34px;
    }

    header{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
      margin-bottom: 16px;
    }
    .title h1{
      margin:0;
      font-size: clamp(28px, 4vw, 44px);
      letter-spacing: .2px;
      line-height: 1.05;
    }
    .title p{
      margin:6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .topActions{
      display:flex;
      align-items:center;
      gap:10px;
      position:relative;
    }

    .btn{
      border: 1px solid var(--stroke2);
      background: rgba(255,255,255,.06);
      color: var(--text);
      border-radius: 14px;
      padding: 10px 14px;
      font-weight: 650;
      cursor:pointer;
      transition: transform .08s ease, background .18s ease, border-color .18s ease;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover{ background: rgba(255,255,255,.10); border-color: rgba(255,255,255,.22); }
    .btn:active{ transform: translateY(1px); }
    .btnPrimary{
      border-color: rgba(45,212,122,.45);
      background: rgba(45,212,122,.14);
    }
    .btnPrimary:hover{ background: rgba(45,212,122,.20); border-color: rgba(45,212,122,.62); }

    /* ===== Layout: kalender større, højre panel smallere ===== */
    .grid{
      display:grid;
      grid-template-columns: minmax(0, 2.35fr) minmax(260px, 0.45fr);
      gap: 16px;
      align-items:stretch;
    }

    .card{
      background: var(--card);
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow);
      border-radius: var(--r);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      min-width: 0;
    }
    .cardInner{ padding: 16px; }

    .card h2{
      margin:0 0 4px;
      font-size: 18px;
      letter-spacing:.2px;
    }
    .card .sub{
      margin:0 0 14px;
      color: var(--muted2);
      font-size: 13px;
    }

    /* ===== Login screen ===== */
    #loginScreen{
      min-height: calc(100vh - 48px);
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 10px 0;
    }

    .loginStack{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      width: 100%;
    }

    .loginHero{
      width: min(640px, 96vw);
      text-align:center;
      margin-bottom: clamp(28px, 6vw, 52px);
    }
    .loginHero .big{
      font-size: clamp(44px, 6vw, 72px);
      font-weight: 900;
      letter-spacing: .4px;
      margin: 0;
      line-height: 1.02;
    }

    .loginBox{
      width: min(560px, 96vw);
      padding: 18px;
      text-align:left;
    }
    .loginBox .row{
      display:flex; gap: 10px;
      align-items:center;
      margin-top: 0;
    }

    .field{
      width:100%;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 14px;
      padding: 12px 14px;
      color: var(--text);
      outline:none;
      font-size: 16px;
      min-width: 0;
    }
    .field:focus{
      border-color: rgba(255,255,255,.28);
      box-shadow: 0 0 0 4px rgba(255,255,255,.07);
    }

    select.field{
      appearance:auto;
      -webkit-appearance:auto;
      -moz-appearance:auto;
    }
    select.field option{
      background: #0f141b;
      color: #f3f5f7;
    }

    .msg{
      margin-top: 10px;
      font-size: 14px;
      color: rgba(255,220,220,.92);
      display:none;
    }
    .msg.ok{ color: rgba(205,255,225,.92); }

    /* ===== Calendar ===== */
    .calHeader{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .monthTitle{
      display:flex;
      flex-direction:column;
      gap:3px;
      min-width: 0;
    }
    .monthTitle .m{
      font-size: 18px;
      font-weight: 750;
      letter-spacing:.2px;
      text-transform: capitalize;
    }
    .monthTitle .t{
      font-size: 12px;
      color: var(--muted2);
    }
    .nav{
      display:flex; align-items:center; gap:10px;
    }
    .nav .btn{ padding: 10px 12px; min-width: 44px; }

    .calScroll{
      overflow-x: hidden;
      overflow-y: hidden;
      min-width: 0;
    }

    /* Søndag gøres lidt bredere end de andre (sidste kolonne) */
    .weekdays{
      display:grid;
      grid-template-columns: 62px repeat(6, minmax(0, 1fr)) minmax(0, 1.22fr);
      gap: 8px;
      margin-bottom: 8px;
      padding: 0 2px;
      color: rgba(255,255,255,.72);
      font-size: 12px;
      min-width: 0;
    }
    .weekdays div{ text-align:center; }
    .weekdays .wlab{
      text-align:left;
      padding-left: 6px;
      opacity: .9;
      font-weight: 750;
    }

    .days{
      display:grid;
      grid-template-columns: 62px repeat(6, minmax(0, 1fr)) minmax(0, 1.22fr);
      gap: 10px;
      min-width: 0;
    }

    .weekCell{
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.03);
      border-radius: 14px;
      min-height: 92px;
      padding: 10px;
      display:flex;
      align-items:center;
      justify-content:center;
      color: rgba(255,255,255,.70);
      font-weight: 850;
      letter-spacing: .2px;
      min-width: 0;
    }
    .weekCell .wk{
      display:flex;
      align-items:center;
      justify-content:center;
      width: 100%;
      height: 100%;
      text-align:center;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.18);
      font-size: 12px;
      line-height: 1;
    }

    .day{
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.05);
      border-radius: 14px;
      min-height: 92px;
      padding: 10px;
      display:flex;
      flex-direction:column;
      gap: 8px;
      cursor:pointer;
      transition: transform .06s ease, border-color .18s ease, background .18s ease;
      user-select:none;
      position:relative;
      overflow: hidden;
      min-width: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .day:hover{ border-color: rgba(255,255,255,.18); background: rgba(255,255,255,.07); }
    .day:active{ transform: translateY(1px); }
    .day.muted{
      opacity: .38;
      cursor: default;
    }
    .day.muted:hover{ background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.10); }
    .dayTop{
      display:flex; justify-content:space-between; align-items:baseline;
      gap: 8px;
      min-width: 0;
    }
    .num{ font-weight: 800; font-size: 14px; }
    .dow{ font-size: 12px; color: rgba(255,255,255,.70); }

    .pill{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.20);
      font-weight: 750;
      font-size: 12px;
      line-height: 1.15;
      letter-spacing:.2px;
      white-space: nowrap;
      max-width: 100%;
      overflow:hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    .pill.taastrup{ border-color: rgba(74,166,255,.55); background: rgba(74,166,255,.14); }
    .pill.horsens{ border-color: rgba(183,123,255,.55); background: rgba(183,123,255,.14); }
    .pill.birkeroed{ border-color: rgba(62,230,195,.55); background: rgba(62,230,195,.14); }
    .pill.booking{
      border-color: rgba(45,212,122,.55);
      background: rgba(45,212,122,.16);
      justify-content:flex-start;
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
      line-height: 1.2;
    }

    .pill.special{
      border-color: rgba(255,181,94,.55);
      background: rgba(255,181,94,.14);
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
      line-height: 1.2;
    }

    /* Søndagspillen må wrappe og må ikke klippes */
    .pill.shiftday{
      font-size: 11px;
      padding: 7px 12px;
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
      line-height: 1.2;
    }

    /* Gør det mere tydeligt at den oprindelige ejer er "overrulet" */
    .pill.strike{
      text-decoration: line-through;
      text-decoration-thickness: 2px;
      text-decoration-color: rgba(255,255,255,.78);
      opacity: .42;
      border-style: dashed;
    }

    /* ===== Form ===== */
    .formGrid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
      min-width: 0;
    }
    .formGrid .full{ grid-column: 1 / -1; }

    label{
      display:block;
      margin: 10px 0 6px;
      font-size: 12px;
      color: rgba(255,255,255,.74);
    }
    textarea.field{
      min-height: 58px;
      resize: vertical;
    }

    .rowBtns{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-top: 12px;
    }

    .status{
      margin-top: 10px;
      font-size: 13px;
      color: rgba(205,255,225,.92);
      display:none;
      white-space: pre-line;
    }

    /* Gør højrepanelet mere kompakt */
    aside .cardInner{ padding: 14px; }
    aside .sub{ margin-bottom: 10px; }
    aside label{ margin-top: 8px; }
    aside .formGrid{ gap: 8px; }

    .panelDivider{
      height: 1px;
      background: rgba(255,255,255,.12);
      margin-top: 18px;
      margin-bottom: 14px;
    }

    .hidden{ display:none !important; }

    /* ===== Modal / overlay (bruges også som skuffe) ===== */
    .modalBack{
      position:fixed;
      inset:0;
      background: rgba(0,0,0,.55);
      display:none;
      align-items:center;
      justify-content:center;
      padding: 18px;
      z-index: 50;
    }
    .modalBack.show{ display:flex; }

    .modal{
      width: min(620px, 96vw);
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(15,18,22,.92);
      box-shadow: 0 18px 50px rgba(0,0,0,.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      overflow:hidden;
    }
    .modal .head{
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255,255,255,.10);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
    }
    .modal .head .h{
      font-weight: 850;
      letter-spacing:.2px;
    }
    .modal .body{
      padding: 16px;
    }
    .modal .foot{
      padding: 14px 16px;
      border-top: 1px solid rgba(255,255,255,.10);
      display:flex;
      justify-content:flex-end;
      gap:10px;
      flex-wrap: wrap;
    }

    /* Skuffe-layout */
    .modalBack.drawerMode{
      justify-content:flex-end;
      align-items:stretch;
      padding: 0;
    }
    .modal.drawer{
      width: min(560px, 94vw);
      height: 100%;
      max-height: 100vh;
      border-radius: 0;
    }
    .modal.drawer .body{
      overflow:auto;
      max-height: calc(100vh - 56px - 66px);
    }

    /* ===== Ændringer i skuffe ===== */
    .chgTopRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .chgHint{
      color: rgba(255,255,255,.70);
      font-size: 12px;
      margin: 0;
    }
    .chgList{
      display:flex;
      flex-direction:column;
      gap: 10px;
    }
    .chgItem{
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.05);
      border-radius: 14px;
      padding: 12px;
      display:flex;
      justify-content:space-between;
      gap: 10px;
      align-items:flex-end;
      min-width: 0;
    }
    .chgMeta{
      display:flex;
      flex-direction:column;
      gap: 6px;
      min-width: 0;
    }
    .chgWho{
      font-weight: 850;
      white-space: normal;
      word-break: break-word;
      line-height: 1.15;
    }
    .chgDates{
      color: rgba(255,255,255,.78);
      font-size: 12px;
    }
    .chgSmallRow{
      display:flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items:center;
    }
    .chip{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.20);
      font-size: 12px;
      color: rgba(255,255,255,.84);
      white-space: nowrap;
    }
    .chip.dim{
      color: rgba(255,255,255,.70);
    }
    .chgNote{
      color: rgba(255,255,255,.74);
      font-size: 12px;
      line-height: 1.25;
      white-space: normal;
      word-break: break-word;
    }
    .btnRow{
      display:flex;
      gap:8px;
      align-items:center;
      flex-shrink: 0;
    }
    .danger{
      border-color: rgba(255,100,100,.35);
      background: rgba(255,60,60,.10);
    }

    /* ===== Dropdown ===== */
    .dropMenu{
      position:absolute;
      top: 48px;
      right: 0;
      min-width: 260px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(15,18,22,.92);
      box-shadow: 0 18px 50px rgba(0,0,0,.65);
      display:none;
      overflow:hidden;
      z-index: 60;
    }
    .dropMenu.show{ display:block; }
    .dropMenu button{
      width:100%;
      text-align:left;
      border:0;
      background: transparent;
      padding: 10px 12px;
      color: var(--text);
      cursor:pointer;
      font-weight: 650;
    }
    .dropMenu button:hover{
      background: rgba(255,255,255,.08);
    }
    .dropMenu button:disabled{
      cursor: default;
    }
    .dropMenu .sep{
      height:1px;
      background: rgba(255,255,255,.10);
    }

    /* ===== Laptop: lav en smule nedskalering så det føles mindre rodet ===== */
    @media (max-width: 1400px){
      .wrap{ padding: 18px 18px 28px; }
      .grid{
        grid-template-columns: minmax(0, 2.55fr) minmax(260px, 0.45fr);
        gap: 14px;
      }
      .cardInner{ padding: 14px; }

      .day{ min-height: 86px; padding: 9px; gap: 7px; }
      .pill{ font-size: 11px; padding: 6px 10px; }
      .pill.shiftday{ font-size: 10.5px; padding: 6px 10px; }
      .nav .btn{ min-width: 42px; padding: 9px 11px; }

      /* På laptop: stack Start/Slut så felter aldrig bliver klemt */
      aside .formGrid{ grid-template-columns: 1fr; }
      aside .formGrid .full{ grid-column: 1 / -1; }
    }

    /* ===== Hvis skærmen er for smal, skift til 1 kolonne ===== */
    @media (max-width: 1100px){
      .grid{ grid-template-columns: 1fr; }
    }

    /* ===== Mobil: tillad swipe hvis nødvendigt ===== */
    @media (max-width: 980px){
      #appHeader{
        position: sticky;
        top: 0;
        z-index: 40;
        background: rgba(11,15,20,.70);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        padding-top: 10px;
        margin-top: -10px;
      }

      .wrap{ padding: 16px 14px 26px; }

      .calScroll{
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 6px;
      }

      .weekdays, .days{ min-width: 820px; }

      .day{ min-height: 116px; padding: 12px; }
      .nav .btn{ min-width: 46px; padding: 12px 12px; }
      .btn{ padding: 12px 14px; }

      .modalBack.drawerMode .modal.drawer{ width: 94vw; }
    }
  </style>
</head>

<body>
  <div class="bg"></div>

  <div class="wrap">
    <header id="appHeader" class="hidden">
      <div class="title">
        <h1 id="welcomeTitle">Samsøhuset</h1>
        <p>Kalender og eventuelle ændringer</p>
      </div>

      <div class="topActions">
        <button id="extraBtn" class="btn" type="button">Yderligere info</button>
        <div id="extraMenu" class="dropMenu"></div>

        <button id="logoutBtn" class="btn" type="button">Log ud</button>
      </div>
    </header>

    <!-- LOGIN -->
    <section id="loginScreen">
      <div class="loginStack">
        <div class="loginHero">
          <h1 class="big">Samsøhuset</h1>
        </div>

        <div class="card loginBox">
          <div class="cardInner">
            <!-- Kun kodefelt + login-knap -->
            <div class="row">
              <input id="passInput" class="field" type="password" placeholder="Kode" autocomplete="current-password" />
              <button id="loginBtn" class="btn btnPrimary" type="button">Log ind</button>
            </div>

            <div id="loginMsg" class="msg"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- APP -->
    <main id="app" class="grid hidden">

      <!-- Calendar -->
      <section class="card">
        <div class="cardInner">
          <div class="calHeader">
            <div class="monthTitle">
              <div id="monthName" class="m">-</div>
              <div class="t">Klik på en dag for start. Klik igen for slut.</div>
            </div>
            <div class="nav">
              <button id="prevBtn" class="btn" type="button">◀</button>
              <button id="todayBtn" class="btn" type="button">I dag</button>
              <button id="nextBtn" class="btn" type="button">▶</button>
            </div>
          </div>

          <div class="calScroll">
            <div class="weekdays">
              <div class="wlab">Uge</div>
              <div>Man</div><div>Tir</div><div>Ons</div><div>Tor</div><div>Fre</div><div>Lør</div><div>Søn</div>
            </div>

            <div id="days" class="days"></div>
          </div>
        </div>
      </section>

      <!-- Booking panel -->
      <aside class="card">
        <div class="cardInner">
          <h2>Foretag ændringer</h2>
          <p class="sub">Vælg i kalenderen, eller udfyld felterne her.</p>

          <div class="formGrid">
            <div>
              <label for="startInput">Start</label>
              <input id="startInput" class="field" type="date" />
            </div>
            <div>
              <label for="endInput">Slut</label>
              <input id="endInput" class="field" type="date" />
            </div>

            <div class="full">
              <label for="whoInput">Hvem har huset (kan være familie/venner)</label>
              <input id="whoInput" class="field" type="text" placeholder="Fx navn, familie, venner..." />
            </div>

            <div class="full">
              <label for="changedByInput">Ændret af</label>
              <input id="changedByInput" class="field" type="text" placeholder="Navn" />
            </div>

            <div class="full">
              <label for="visibilityInput">Synlighed</label>
              <select id="visibilityInput" class="field">
                <option value="">Vælg...</option>
              </select>
            </div>

            <div class="full">
              <label for="noteInput">Note (valgfri)</label>
              <textarea id="noteInput" class="field" placeholder="Kort note"></textarea>
            </div>
          </div>

          <div class="rowBtns">
            <button id="resetBtn" class="btn" type="button">Nulstil</button>
            <button id="saveBtn" class="btn btnPrimary" type="button">Gem</button>
          </div>

          <div id="status" class="status">-</div>

          <div class="panelDivider"></div>

          <button id="openChangesBtn" class="btn" type="button" style="width:100%;">Se ændringer</button>
        </div>
      </aside>

    </main>
  </div>

  <!-- Modal / Overlay -->
  <div id="modalBack" class="modalBack" aria-hidden="true">
    <div id="modal" class="modal" role="dialog" aria-modal="true">
      <div class="head">
        <div id="modalTitle" class="h">-</div>
        <button id="modalClose" class="btn" type="button">Luk</button>
      </div>
      <div id="modalBody" class="body"></div>
      <div id="modalFoot" class="foot"></div>
    </div>
  </div>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    /* =========================================================
       KONFIGURATION
       ========================================================= */
    const ADMIN_CODE = "Kalkhavesvej100!";

    /* ===== Kalender ===== */
    const DK_MONTHS = ["januar","februar","marts","april","maj","juni","juli","august","september","oktober","november","december"];
    const DK_DOW = ["Søn","Man","Tir","Ons","Tor","Fre","Lør"];

    let view = new Date(YEAR, 0, 1);
    view.setHours(12,0,0,0);

    let selectedStart = null;
    let selectedEnd = null;

    let stays = [];

    function isoDate(d){
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,"0");
      const da = String(d.getDate()).padStart(2,"0");
      return `${y}-${m}-${da}`;
    }
    function parseISO(s){
      const parts = (s || "").split("-").map(Number);
      const y = parts[0] || 1970;
      const m = parts[1] || 1;
      const d = parts[2] || 1;
      const dt = new Date(y, m-1, d);
      dt.setHours(12,0,0,0);
      return dt;
    }
    function startOfDay(d){
      const x = new Date(d);
      x.setHours(12,0,0,0);
      return x;
    }
    function addDays(d, n){
      const x = new Date(d);
      x.setDate(x.getDate()+n);
      return startOfDay(x);
    }
    function clampDateOrder(a,b){
      if (!a || !b) return [a,b];
      return a <= b ? [a,b] : [b,a];
    }
    function sameDay(a,b){
      return a && b && a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
    }
    function inRange(day, a, b){
      if (!a || !b) return false;
      const d = day.getTime();
      return d >= a.getTime() && d <= b.getTime();
    }

    function mondayStart(d){
      const x = startOfDay(d);
      const js = x.getDay();
      const diff = (js === 0) ? -6 : (1 - js);
      return addDays(x, diff);
    }

    function isoWeekInfo(date){
      const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const dayNum = d.getUTCDay() || 7;
      d.setUTCDate(d.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
      return { year: d.getUTCFullYear(), week: weekNo };
    }

    function pad2(n){ return String(n).padStart(2,"0"); }

    function ownerClass(name){
      const n = (name||"").toLowerCase();
      if (n.includes("taastrup")) return "taastrup";
      if (n.includes("horsens")) return "horsens";
      if (n.includes("birker")) return "birkeroed";
      return "";
    }

    function isSpecialWeek(isoWeek){
      if (!isoWeek) return false;
      if (isoWeek.year !== YEAR) return false;
      return !!SPECIAL_WEEKS_2026[isoWeek.week];
    }

    function specialLabel(isoWeek){
      return SPECIAL_WEEKS_2026[isoWeek.week] || "";
    }

    function rotationIndexOfOwner(owner){
      const idx = ROTATION.indexOf(owner);
      return idx >= 0 ? idx : 0;
    }

    function ownerForIsoWeek(isoWeek){
      if (!isoWeek || isoWeek.year !== YEAR) return { type: "out", label: "" };

      if (isSpecialWeek(isoWeek)){
        return { type: "special", label: specialLabel(isoWeek) };
      }

      const baseWeek = ROTATION_START_ISO_WEEK;
      let idx = rotationIndexOfOwner(ROTATION_START_OWNER);

      if (isoWeek.week === baseWeek){
        return { type: "owner", owner: ROTATION[idx] };
      }

      if (isoWeek.week > baseWeek){
        for (let w = baseWeek; w < isoWeek.week; w++){
          if (SPECIAL_WEEKS_2026[w]) continue;
          idx = (idx + 1) % ROTATION.length;
        }
        return { type: "owner", owner: ROTATION[idx] };
      }

      for (let w = baseWeek - 1; w >= isoWeek.week; w--){
        if (SPECIAL_WEEKS_2026[w]) continue;
        idx = (idx - 1 + ROTATION.length) % ROTATION.length;
      }
      return { type: "owner", owner: ROTATION[idx] };
    }

    function baseInfoForDate(d){
      const mon = mondayStart(d);
      const w = isoWeekInfo(mon);

      if (w.year !== YEAR){
        return { type: "out", label: "" };
      }

      if (d.getDay() === 0){
        const currentWeek = w;
        const nextWeek = isoWeekInfo(addDays(mon, 7));

        const cur = ownerForIsoWeek(currentWeek);
        const nxt = ownerForIsoWeek(nextWeek);

        const curLabel = cur.type === "special" ? cur.label : (cur.owner || "");
        const nxtLabel = nxt.type === "special" ? nxt.label : (nxt.owner || "");

        return {
          type: "shift",
          current: cur,
          next: nxt,
          text: `${curLabel} → ${nxtLabel}`
        };
      }

      const own = ownerForIsoWeek(w);
      if (own.type === "special") return { type: "special", label: own.label, week: w.week };
      return { type: "owner", owner: own.owner, week: w.week };
    }

    function getViewerRoleForVisibility(){
      if (isAdmin()) return "admin";
      const r = getRole();
      if (r === "Taastrup" || r === "Horsens" || r === "Birkerød") return r;
      return "shared";
    }

    function canViewerSeeStay(stay){
      if (!stay) return false;
      const vis = (stay.visibility || "all").toString();
      if (isAdmin()) return true;
      const viewer = getViewerRoleForVisibility();
      if (vis === "all") return true;
      return viewer === vis;
    }

    function isHistorical(stay){
      if (!stay) return false;
      const today = startOfDay(new Date());
      const end = parseISO(stay.end_date);
      return end.getTime() < today.getTime();
    }

    function canEditOrDeleteStay(stay){
      if (!stay) return false;

      if (isAdmin()){
        return true;
      }

      if (!isFamilyRole()) return false;

      if (stay.created_role !== getRole()) return false;
      if (isHistorical(stay)) return false;
      return true;
    }

    function isSundayISO(iso){
      const d = parseISO(iso);
      return d.getDay() === 0;
    }

    function isAllowedSundayOnlyOverlap(aStart, aEnd, bStart, bEnd){
      const oStart = (aStart > bStart) ? aStart : bStart;
      const oEnd = (aEnd < bEnd) ? aEnd : bEnd;

      if (oStart > oEnd) return true;
      if (oStart !== oEnd) return false;

      const day = oStart;
      if (!isSundayISO(day)) return false;

      const ok1 = (aEnd === day && bStart === day);
      const ok2 = (bEnd === day && aStart === day);
      return ok1 || ok2;
    }

    function findStaysForDateVisible(d){
      const dayISO = isoDate(d);
      const matches = stays
        .filter(s => s.start_date <= dayISO && s.end_date >= dayISO)
        .filter(s => canViewerSeeStay(s));

      if (d.getDay() !== 0) return matches.slice(0, 1);

      const sorted = [...matches].sort((a,b)=>{
        const aEnds = (a.end_date === dayISO) ? 0 : 1;
        const bEnds = (b.end_date === dayISO) ? 0 : 1;
        if (aEnds !== bEnds) return aEnds - bEnds;
        return (a.start_date || "").localeCompare(b.start_date || "");
      });

      return sorted.slice(0, 2);
    }

    function monthLabel(d){
      return `${DK_MONTHS[d.getMonth()]} ${d.getFullYear()}`;
    }

    function render(){
      monthName.textContent = monthLabel(view);

      const first = new Date(view.getFullYear(), view.getMonth(), 1);
      first.setHours(12,0,0,0);

      const firstMonday = mondayStart(first);
      const start = firstMonday;

      const viewMonth = view.getMonth();

      daysEl.innerHTML = "";

      // Vis kun uger hvor mindst én dag i ugen er i den viste måned
      for (let row = 0; row < 6; row++){
        const rowMonday = addDays(start, row * 7);

        let weekHasDayInMonth = false;
        for (let col = 0; col < 7; col++){
          const d = addDays(rowMonday, col);
          if (d.getFullYear() === YEAR && d.getMonth() === viewMonth){
            weekHasDayInMonth = true;
            break;
          }
        }
        if (!weekHasDayInMonth) continue;

        const wInfo = isoWeekInfo(rowMonday);

        const wc = document.createElement("div");
        wc.className = "weekCell";
        const wk = document.createElement("div");
        wk.className = "wk";
        wk.textContent = (wInfo.year === YEAR) ? ("Uge " + pad2(wInfo.week)) : "";
        wc.appendChild(wk);
        daysEl.appendChild(wc);

        for (let col = 0; col < 7; col++){
          const d = addDays(rowMonday, col);
          const inThisMonth = d.getMonth() === view.getMonth();
          const inYear = d.getFullYear() === YEAR;

          const day = document.createElement("div");
          day.className = "day" + (inThisMonth && inYear ? "" : " muted");

          const top = document.createElement("div");
          top.className = "dayTop";

          const num = document.createElement("div");
          num.className = "num";
          num.textContent = String(d.getDate());

          const dow = document.createElement("div");
          dow.className = "dow";
          dow.textContent = DK_DOW[d.getDay()];

          top.appendChild(num);
          top.appendChild(dow);
          day.appendChild(top);

          if (!inYear){
            daysEl.appendChild(day);
            continue;
          }

          const base = baseInfoForDate(d);
          const visibleStays = findStaysForDateVisible(d);

          if (base.type === "shift"){
            const p = document.createElement("div");

            const nextClass =
              base.next.type === "owner"
                ? ownerClass(base.next.owner)
                : "special";

            p.className = "pill shiftday " + nextClass;
            p.textContent = base.text;
            p.title = base.text;
            day.appendChild(p);

          } else if (base.type === "special"){
            const p = document.createElement("div");
            p.className = "pill special";
            p.textContent = base.label;
            p.title = base.label;
            day.appendChild(p);

          } else {
            const p = document.createElement("div");
            p.className = "pill " + ownerClass(base.owner);
            p.textContent = base.owner;

            if (visibleStays.length){
              p.classList.add("strike");
              p.title = "Denne periode er ændret";
            }

            day.appendChild(p);
          }

          if (visibleStays.length === 1){
            const b = document.createElement("div");
            b.className = "pill booking";
            b.textContent = `${visibleStays[0].family || "—"}`;
            b.title = `${visibleStays[0].family || ""}`;
            day.appendChild(b);
          }

          if (visibleStays.length === 2){
            const a = visibleStays[0].family || "—";
            const b2 = visibleStays[1].family || "—";
            const b = document.createElement("div");
            b.className = "pill booking";
            b.textContent = `${a} → ${b2}`;
            b.title = `${a} → ${b2}`;
            day.appendChild(b);
          }

          if (selectedStart && sameDay(d, selectedStart)) {
            day.style.outline = "2px solid rgba(45,212,122,.85)";
            day.style.outlineOffset = "2px";
          } else if (selectedEnd && sameDay(d, selectedEnd)) {
            day.style.outline = "2px solid rgba(45,212,122,.85)";
            day.style.outlineOffset = "2px";
          } else {
            day.style.outline = "";
            day.style.outlineOffset = "";
          }

          if (selectedStart && selectedEnd && inRange(d, selectedStart, selectedEnd)){
            day.style.borderColor = "rgba(45,212,122,.35)";
            day.style.background = "rgba(45,212,122,.08)";
          } else {
            day.style.borderColor = "";
            day.style.background = "";
          }

          if (inThisMonth && inYear){
            day.addEventListener("click", ()=> onDayClick(d));
          }

          daysEl.appendChild(day);
        }
      }
    }

    function onDayClick(date){
      if (!selectedStart || (selectedStart && selectedEnd)){
        selectedStart = date;
        selectedEnd = null;
      } else {
        selectedEnd = date;
        [selectedStart, selectedEnd] = clampDateOrder(selectedStart, selectedEnd);
      }

      if (selectedStart) startInput.value = isoDate(selectedStart);
      if (selectedEnd) endInput.value = isoDate(selectedEnd);

      render();
    }

    /* ===== Supabase stays ===== */
    async function loadStays(){
      const client = getSupabaseClient();
      if (!client){
        setStatus("Kunne ikke forbinde lige nu. Prøv at genindlæse.", false);
        return;
      }

      const { data, error } = await client
        .from(STAYS_TABLE)
        .select("*")
        .order("start_date", { ascending: true });

      if (error){
        setStatus("Kunne ikke hente data.\n" + (error.message || ""), false);
        console.error(error);
        return;
      }

      stays = Array.isArray(data) ? data : [];
      render();
    }

    function overlapsExisting(aISO, bISO, ignoreId){
      return stays.some(s=>{
        if (ignoreId && String(s.id) === String(ignoreId)) return false;

        if (s.end_date < aISO || s.start_date > bISO) return false;

        const allowed = isAllowedSundayOnlyOverlap(aISO, bISO, s.start_date, s.end_date);
        return !allowed;
      });
    }

    function minStartDateISO(){
      const t = startOfDay(new Date());
      const min = addDays(t, 1);
      return isoDate(min);
    }

    let editingId = null;

    async function saveStay(){
      const s = startInput.value;
      const e = endInput.value;
      const who = (whoInput.value || "").trim();
      const changedBy = (changedByInput.value || "").trim();
      const note = (noteInput.value || "").trim();
      const vis = (visibilityInput.value || "").trim();

      if (!s || !e){
        setStatus("Vælg både start og slut.", false);
        return;
      }
      if (!who){
        setStatus("Skriv hvem der har huset.", false);
        return;
      }
      if (!changedBy){
        setStatus("Skriv hvem der har ændret.", false);
        return;
      }
      if (!vis){
        setStatus("Vælg synlighed.", false);
        return;
      }

      if (!isAdmin()){
        if (isFamilyRole()){
          if (!(vis === "all" || vis === getRole())){
            setStatus("Du kan kun vælge din egen familie eller ses af alle.", false);
            return;
          }
        } else {
          if (vis !== "all"){
            setStatus("Du kan kun vælge ses af alle.", false);
            return;
          }
        }
      }

      const [a,b] = clampDateOrder(s, e);

      const minISO = minStartDateISO();
      if (a < minISO){
        setStatus("Du kan kun lave ændringer fra i morgen.", false);
        return;
      }

      if (overlapsExisting(a, b, editingId)){
        setStatus("Der findes allerede en ændring i perioden. Søndag kan kun deles hvis den ene slutter søndag og den anden starter søndag.", false);
        return;
      }

      const client = getSupabaseClient();
      if (!client){
        setStatus("Kunne ikke forbinde.", false);
        return;
      }

      const payload = {
        start_date: a,
        end_date: b,
        family: who,
        booked_by: changedBy,
        note: note,
        visibility: vis,
        created_role: isAdmin() ? "admin" : getRole()
      };

      let res;
      if (editingId){
        const current = stays.find(x=>String(x.id)===String(editingId)) || null;
        if (!current){
          setStatus("Kunne ikke finde ændringen.", false);
          return;
        }
        if (!canEditOrDeleteStay(current)){
          setStatus("Du må ikke redigere denne ændring.", false);
          return;
        }
        res = await client.from(STAYS_TABLE).update(payload).eq("id", editingId);
      } else {
        res = await client.from(STAYS_TABLE).insert(payload);
      }

      if (res.error){
        setStatus("Kunne ikke gemme.\n" + (res.error.message || ""), false);
        console.error(res.error);
        return;
      }

      setStatus("Gemt ✅");
      resetForm(false);
      await loadStays();
    }

    async function deleteStay(id){
      const stay = stays.find(s=>String(s.id)===String(id)) || null;
      if (!stay){
        setStatus("Kunne ikke finde ændringen.", false);
        return;
      }

      if (!canEditOrDeleteStay(stay)){
        setStatus("Du må ikke slette denne ændring.", false);
        return;
      }

      openModal(
        "OBS",
        `<div style="line-height:1.35; color: rgba(255,255,255,.85);">
          Denne ændring er lavet af <b>${escapeHtml(stay.booked_by || "-")}</b>.<br><br>
          Hvis du sletter denne ændring, forsvinder den permanent og kan ikke genskabes.
        </div>`,
        [
          { text: "Nej", onClick: ()=> closeModal() },
          { text: "Ja, slet", danger:true, primary:true, onClick: async ()=>{
              closeModal();
              const client = getSupabaseClient();
              if (!client){
                setStatus("Kunne ikke forbinde.", false);
                return;
              }
              const { error } = await client.from(STAYS_TABLE).delete().eq("id", id);
              if (error){
                setStatus("Kunne ikke slette.\n" + (error.message || ""), false);
                console.error(error);
                return;
              }
              setStatus("Slettet");
              await loadStays();
          }}
        ]
      );
    }

    function resetForm(clearSelection=true){
      startInput.value = "";
      endInput.value = "";
      whoInput.value = "";
      changedByInput.value = "";
      noteInput.value = "";
      visibilityInput.value = "";
      editingId = null;
      saveBtn.textContent = "Gem";

      if (clearSelection){
        selectedStart = null;
        selectedEnd = null;
        render();
      }
    }

    function beginEdit(stay){
      if (!stay) return;
      if (!canEditOrDeleteStay(stay)){
        setStatus("Du må ikke redigere denne ændring.", false);
        return;
      }

      editingId = stay.id;
      saveBtn.textContent = "Opdater";

      startInput.value = stay.start_date || "";
      endInput.value = stay.end_date || "";
      whoInput.value = stay.family || "";
      changedByInput.value = stay.booked_by || "";
      noteInput.value = stay.note || "";
      visibilityInput.value = stay.visibility || "all";

      setStatus("Redigering slået til");
    }

    function formatDkDate(iso){
      const d = parseISO(iso);
      const dd = String(d.getDate()).padStart(2,"0");
      const mm = String(d.getMonth()+1).padStart(2,"0");
      return `${dd}.${mm}`;
    }

    function drawerVisibleStays(){
      const visible = stays.filter(s=> canViewerSeeStay(s));
      const future = visible.filter(s=> !isHistorical(s));
      const past = visible.filter(s=> isHistorical(s));

      const sortedFuture = [...future].sort((a,b)=> (a.start_date || "").localeCompare(b.start_date || ""));
      const sortedPast = [...past].sort((a,b)=>{
        const ae = (a.end_date || "");
        const be = (b.end_date || "");
        if (be !== ae) return be.localeCompare(ae);
        const as = (a.start_date || "");
        const bs = (b.start_date || "");
        return bs.localeCompare(as);
      });

      return { sortedFuture, sortedPast };
    }

    function openChangesDrawer(){
      const wrap = document.createElement("div");

      const top = document.createElement("div");
      top.className = "chgTopRow";

      const left = document.createElement("div");
      const h = document.createElement("div");
      h.style.fontWeight = "900";
      h.style.fontSize = "18px";
      h.textContent = "Ændringer";
      const p = document.createElement("p");
      p.className = "chgHint";
      p.textContent = "Tryk på en ændring for at redigere eller slette (hvis du har rettigheder).";
      left.appendChild(h);
      left.appendChild(p);

      const histBtn = document.createElement("button");
      histBtn.type = "button";
      histBtn.className = "btn";
      histBtn.textContent = showHistoryInDrawer ? "Skjul historiske" : "Vis historiske";

      top.appendChild(left);
      top.appendChild(histBtn);

      const list = document.createElement("div");
      list.className = "chgList";

      function renderDrawerList(){
        list.innerHTML = "";
        const { sortedFuture, sortedPast } = drawerVisibleStays();

        if (!sortedFuture.length && (!showHistoryInDrawer || !sortedPast.length)){
          const empty = document.createElement("div");
          empty.className = "chgItem";
          empty.innerHTML = `<div class="chgMeta"><div class="chgWho">Ingen ændringer endnu</div><div class="chgDates">-</div></div>`;
          list.appendChild(empty);
          return;
        }

        function addStayItem(s){
          const it = document.createElement("div");
          it.className = "chgItem";

          const meta = document.createElement("div");
          meta.className = "chgMeta";

          const who = document.createElement("div");
          who.className = "chgWho";
          who.textContent = s.family || "(ukendt)";

          const dates = document.createElement("div");
          dates.className = "chgDates";
          dates.textContent = `${formatDkDate(s.start_date)} til ${formatDkDate(s.end_date)} (${s.start_date} → ${s.end_date})`;

          const small = document.createElement("div");
          small.className = "chgSmallRow";

          const chipBy = document.createElement("div");
          chipBy.className = "chip";
          chipBy.textContent = s.booked_by ? s.booked_by : "—";

          const visText = (s.visibility === "all" || !s.visibility) ? "alle" : ("kun " + s.visibility);
          const chipVis = document.createElement("div");
          chipVis.className = "chip dim";
          chipVis.textContent = visText;

          small.appendChild(chipBy);
          small.appendChild(chipVis);

          meta.appendChild(who);
          meta.appendChild(dates);
          meta.appendChild(small);

          if (s.note && String(s.note).trim()){
            const note = document.createElement("div");
            note.className = "chgNote";
            note.textContent = String(s.note).trim();
            meta.appendChild(note);
          }

          const btns = document.createElement("div");
          btns.className = "btnRow";

          if (canEditOrDeleteStay(s)){
            const edit = document.createElement("button");
            edit.className = "btn";
            edit.type = "button";
            edit.textContent = "Rediger";
            edit.addEventListener("click", ()=>{
              closeModal();
              beginEdit(s);
            });
            btns.appendChild(edit);

            const del = document.createElement("button");
            del.className = "btn danger";
            del.type = "button";
            del.textContent = "Slet";
            del.addEventListener("click", ()=>{
              closeModal();
              deleteStay(s.id);
            });
            btns.appendChild(del);
          }

          it.appendChild(meta);
          it.appendChild(btns);
          list.appendChild(it);
        }

        sortedFuture.forEach(addStayItem);
        if (showHistoryInDrawer) sortedPast.forEach(addStayItem);
      }

      histBtn.addEventListener("click", ()=>{
        showHistoryInDrawer = !showHistoryInDrawer;
        histBtn.textContent = showHistoryInDrawer ? "Skjul historiske" : "Vis historiske";
        renderDrawerList();
      });

      wrap.appendChild(top);
      wrap.appendChild(list);

      renderDrawerList();

      openModal(
        "Ændringer",
        wrap,
        [
          { text: "Luk", primary:true, onClick: ()=> closeModal() }
        ],
        { drawer:true }
      );
    }

    openChangesBtn.addEventListener("click", openChangesDrawer);

    resetBtn.addEventListener("click", ()=> resetForm(true));
    saveBtn.addEventListener("click", saveStay);

    function clampViewTo2026(d){
      const x = new Date(d);
      if (x.getFullYear() < YEAR) return new Date(YEAR, 0, 1, 12,0,0,0);
      if (x.getFullYear() > YEAR) return new Date(YEAR, 11, 1, 12,0,0,0);
      return x;
    }

    prevBtn.addEventListener("click", ()=>{
      const n = new Date(view.getFullYear(), view.getMonth()-1, 1, 12,0,0,0);
      view = clampViewTo2026(n);
      render();
    });
    nextBtn.addEventListener("click", ()=>{
      const n = new Date(view.getFullYear(), view.getMonth()+1, 1, 12,0,0,0);
      view = clampViewTo2026(n);
      render();
    });
    todayBtn.addEventListener("click", ()=>{
      const t = new Date();
      const n = new Date(t.getFullYear(), t.getMonth(), 1, 12,0,0,0);
      view = clampViewTo2026(n);
      render();
    });

    /* ===== Yderligere info (Supabase) ===== */
    let extraItems = [];

    async function loadExtraInfo(){
      const client = getSupabaseClient();
      if (!client){
        extraItems = [];
        buildExtraMenu();
        return;
      }

      const { data, error } = await client
        .from(EXTRA_TABLE)
        .select("*")
        .order("created_at", { ascending: false });

      if (error){
        extraItems = [];
        buildExtraMenu();
        setStatus("Yderligere info kunne ikke hentes.\n" + (error.message || ""), false);
        console.error(error);
        return;
      }

      extraItems = Array.isArray(data) ? data : [];
      buildExtraMenu();
    }

    function buildExtraMenu(){
      extraMenu.innerHTML = "";

      if (!extraItems.length){
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = "Ingen punkter endnu";
        b.disabled = true;
        b.style.opacity = ".7";
        extraMenu.appendChild(b);
      } else {
        extraItems.forEach((it)=>{
          const b = document.createElement("button");
          b.type = "button";
          b.textContent = it.title || "-";
          b.addEventListener("click", ()=>{
            extraMenu.classList.remove("show");
            openExtraView(it);
          });
          extraMenu.appendChild(b);
        });
      }

      extraMenu.appendChild(document.createElement("div")).className = "sep";

      if (isAdmin()){
        const add = document.createElement("button");
        add.type = "button";
        add.textContent = "Tilføj nyt punkt";
        add.addEventListener("click", ()=>{
          extraMenu.classList.remove("show");
          openExtraEditor(null);
        });
        extraMenu.appendChild(add);

        const manage = document.createElement("button");
        manage.type = "button";
        manage.textContent = "Administrer punkter";
        manage.addEventListener("click", ()=>{
          extraMenu.classList.remove("show");
          openExtraManager();
        });
        extraMenu.appendChild(manage);
      }
    }

    function openExtraView(item){
      const wrap = document.createElement("div");
      wrap.style.display = "flex";
      wrap.style.flexDirection = "column";
      wrap.style.gap = "10px";

      const t = document.createElement("div");
      t.style.fontWeight = "850";
      t.style.fontSize = "18px";
      t.textContent = item.title || "-";

      const c = document.createElement("div");
      c.style.whiteSpace = "pre-wrap";
      c.style.color = "rgba(255,255,255,.82)";
      c.textContent = item.content || "";

      wrap.appendChild(t);
      wrap.appendChild(c);

      const btns = [{ text:"Luk", onClick: ()=> closeModal(), primary:true }];

      if (isAdmin()){
        btns.unshift({ text:"Rediger", onClick: ()=>{
          closeModal();
          openExtraEditor(item);
        }});
      }

      openModal("Yderligere info", wrap, btns);
    }

    function openExtraEditor(item){
      if (!isAdmin()){
        setStatus("Kun administrator kan redigere.", false);
        return;
      }

      const isEdit = !!item;

      const wrap = document.createElement("div");
      wrap.style.display = "flex";
      wrap.style.flexDirection = "column";
      wrap.style.gap = "10px";

      const title = document.createElement("input");
      title.className = "field";
      title.placeholder = "Titel";
      title.value = item ? (item.title || "") : "";

      const content = document.createElement("textarea");
      content.className = "field";
      content.placeholder = "Indhold";
      content.style.minHeight = "140px";
      content.value = item ? (item.content || "") : "";

      wrap.appendChild(title);
      wrap.appendChild(content);

      openModal(
        isEdit ? "Rediger punkt" : "Tilføj punkt",
        wrap,
        [
          { text:"Annuller", onClick: ()=> closeModal() },
          { text: isEdit ? "Gem" : "Tilføj", primary:true, onClick: async ()=>{
              const t = (title.value || "").trim();
              const c = (content.value || "").trim();

              if (!t){
                setStatus("Skriv en titel.", false);
                return;
              }

              const client = getSupabaseClient();
              if (!client){
                setStatus("Kunne ikke forbinde.", false);
                return;
              }

              if (isEdit){
                const { error } = await client
                  .from(EXTRA_TABLE)
                  .update({ title: t, content: c })
                  .eq("id", item.id);

                if (error){
                  setStatus("Kunne ikke gemme.\n" + (error.message || ""), false);
                  console.error(error);
                  return;
                }
              } else {
                const { error } = await client
                  .from(EXTRA_TABLE)
                  .insert({ title: t, content: c });

                if (error){
                  setStatus("Kunne ikke oprette.\n" + (error.message || ""), false);
                  console.error(error);
                  return;
                }
              }

              closeModal();
              setStatus("Gemt ✅");
              await loadExtraInfo();
          }}
        ]
      );
    }

    function openExtraManager(){
      if (!isAdmin()){
        setStatus("Kun administrator kan administrere.", false);
        return;
      }

      const wrap = document.createElement("div");
      wrap.style.display = "flex";
      wrap.style.flexDirection = "column";
      wrap.style.gap = "10px";

      if (!extraItems.length){
        const d = document.createElement("div");
        d.style.color = "rgba(255,255,255,.75)";
        d.textContent = "Ingen punkter endnu.";
        wrap.appendChild(d);
      } else {
        extraItems.forEach(it=>{
          const row = document.createElement("div");
          row.style.display = "flex";
          row.style.justifyContent = "space-between";
          row.style.alignItems = "center";
          row.style.gap = "10px";
          row.style.border = "1px solid rgba(255,255,255,.10)";
          row.style.background = "rgba(255,255,255,.05)";
          row.style.borderRadius = "14px";
          row.style.padding = "10px";

          const t = document.createElement("div");
          t.style.fontWeight = "800";
          t.style.minWidth = "0";
          t.style.overflow = "hidden";
          t.style.textOverflow = "ellipsis";
          t.style.whiteSpace = "nowrap";
          t.textContent = it.title || "-";

          const btnRow = document.createElement("div");
          btnRow.style.display = "flex";
          btnRow.style.gap = "8px";

          const e = document.createElement("button");
          e.className = "btn";
          e.type = "button";
          e.textContent = "Rediger";
          e.addEventListener("click", ()=>{
            closeModal();
            openExtraEditor(it);
          });

          const del = document.createElement("button");
          del.className = "btn danger";
          del.type = "button";
          del.textContent = "Slet";
          del.addEventListener("click", ()=>{
            openModal(
              "OBS",
              `<div style="line-height:1.35; color: rgba(255,255,255,.85);">
                Hvis du sletter dette punkt, forsvinder det permanent og kan ikke genskabes.
              </div>`,
              [
                { text:"Nej", onClick: ()=> closeModal() },
                { text:"Ja, slet", primary:true, danger:true, onClick: async ()=>{
                    const client = getSupabaseClient();
                    if (!client){
                      setStatus("Kunne ikke forbinde.", false);
                      return;
                    }

                    const { error } = await client
                      .from(EXTRA_TABLE)
                      .delete()
                      .eq("id", it.id);

                    if (error){
                      setStatus("Kunne ikke slette.\n" + (error.message || ""), false);
                      console.error(error);
                      return;
                    }

                    closeModal();
                    setStatus("Slettet");
                    await loadExtraInfo();
                    openExtraManager();
                }}
              ]
            );
          });

          btnRow.appendChild(e);
          btnRow.appendChild(del);

          row.appendChild(t);
          row.appendChild(btnRow);

          wrap.appendChild(row);
        });
      }

      openModal("Administrer punkter", wrap, [{ text:"Luk", primary:true, onClick: ()=> closeModal() }]);
    }

    extraBtn.addEventListener("click", (e)=>{
      e.stopPropagation();
      extraMenu.classList.toggle("show");
    });
    document.addEventListener("click", ()=>{
      extraMenu.classList.remove("show");
    });

    /* ===== Init ===== */
    (async function init(){
      render();

      if (isLoggedIn()){
        showApp();
        applyRoleUI();

        await Promise.all([
          loadStays(),
          loadExtraInfo()
        ]);

        render();
      } else {
        showLogin();
      }
    })();
  </script>
</body>
</html>
