<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Samsøhuset</title>
  <style>
    html, body { height:100%; margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    body { background:#0b0b0b; color:#fff; display:flex; align-items:center; justify-content:center; padding:24px; }
    .box { width:min(560px, 100%); border:1px solid rgba(255,255,255,.18); border-radius:16px; padding:18px; background: rgba(255,255,255,.04); }
    .title { font-weight:900; font-size:22px; margin-bottom:6px; }
    .sub { opacity:.75; margin-bottom:12px; }
    .row { display:flex; gap:10px; }
    input, button { font-size:16px; padding:12px 14px; border-radius:12px; border:1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06); color:#fff; }
    .row input { flex:1; }
    button { cursor:pointer; font-weight:900; }
    button.primary { border-color: rgba(34,197,94,.55); background: rgba(34,197,94,.18); }
    .msg { margin-top:10px; min-height:18px; opacity:.9; }
    .ok { margin-top:12px; padding:12px 14px; border-radius:12px; background: rgba(34,197,94,.18); border:1px solid rgba(34,197,94,.55); display:none; }
  </style>
</head>
<body>

  <div class="box" id="loginBox">
    <div class="title">Samsøhuset</div>
    <div class="sub">Indtast koden for at se kalenderen.</div>

    <div class="row">
      <input id="passInput" type="password" placeholder="Kode" autocomplete="off" />
      <button id="unlockBtn" class="primary" type="button">Lås op</button>
    </div>

    <div id="msg" class="msg"></div>
    <div id="ok" class="ok">Låst op ✅ (denne testside bekræfter at login virker)</div>
  </div>

  <script>
    const SHARED_CODE = "kalkhavesvej";

    const passInput = document.getElementById("passInput");
    const unlockBtn = document.getElementById("unlockBtn");
    const msg = document.getElementById("msg");
    const ok = document.getElementById("ok");

    function norm(s){
      return (s || "").trim().toLowerCase();
    }

    function tryUnlock(){
      msg.textContent = "Klik registreret…";
      const entered = norm(passInput.value);
      const correct = norm(SHARED_CODE);

      if (entered === correct){
        ok.style.display = "block";
        msg.textContent = "Korrekt kode 🎉";
      } else {
        ok.style.display = "none";
        msg.textContent = "Forkert kode – prøv igen";
      }
    }

    unlockBtn.addEventListener("click", tryUnlock);
    passInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") tryUnlock();
    });
  </script>

</body>
</html>
