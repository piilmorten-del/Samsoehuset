<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Samsøhuset</title>

  <style>
    :root{
      --bg:#0b0f14;
      --card: rgba(15,18,22,.78);
      --stroke: rgba(255,255,255,.10);
      --stroke2: rgba(255,255,255,.16);
      --text:#f3f5f7;
      --muted: rgba(255,255,255,.70);
      --muted2: rgba(255,255,255,.55);
      --green:#2dd47a;
      --blue:#4aa6ff;
      --purple:#b77bff;
      --teal:#3ee6c3;
      --shadow: 0 18px 50px rgba(0,0,0,.55);
      --r: 18px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; margin:0; }
    body{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      overflow-x:hidden;
    }

    /* ===== Background image ===== */
    .bg{
      position:fixed; inset:0;
      background-image: url("bg.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: saturate(1.05) contrast(1.05);
      transform: scale(1.02);
    }
    .bg::after{
      content:"";
      position:absolute; inset:0;
      background: radial-gradient(1000px 700px at 25% 15%, rgba(0,0,0,.25), rgba(0,0,0,.75)),
                  linear-gradient(180deg, rgba(0,0,0,.40), rgba(0,0,0,.70));
    }

    .wrap{
      position:relative;
      min-height:100%;
      padding: 22px 22px 34px;
    }

    header{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
      margin-bottom: 16px;
    }
    .title h1{
      margin:0;
      font-size: clamp(28px, 4vw, 44px);
      letter-spacing: .2px;
      line-height: 1.05;
    }
    .title p{
      margin:6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .topActions{
      display:flex; align-items:center; gap:10px;
      flex-wrap: wrap;
      justify-content:flex-end;
    }
    .btn{
      border: 1px solid var(--stroke2);
      background: rgba(255,255,255,.06);
      color: var(--text);
      border-radius: 14px;
      padding: 10px 14px;
      font-weight: 650;
      cursor:pointer;
      transition: transform .08s ease, background .18s ease, border-color .18s ease;
      user-select:none;
    }
    .btn:hover{ background: rgba(255,255,255,.10); border-color: rgba(255,255,255,.22); }
    .btn:active{ transform: translateY(1px); }
    .btnPrimary{
      border-color: rgba(45,212,122,.45);
      background: rgba(45,212,122,.14);
    }
    .btnPrimary:hover{ background: rgba(45,212,122,.20); border-color: rgba(45,212,122,.62); }

    .grid{
      display:grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(280px, .45fr);
      gap: 16px;
      align-items:stretch;
    }

    /* Sørg for at begge kort bliver lige høje */
    #app{
      min-height: calc(100vh - 140px);
      align-items:stretch;
    }
    #app > .card{
      height:100%;
      display:flex;
      flex-direction:column;
    }
    #app > .card > .cardInner{
      height:100%;
      display:flex;
      flex-direction:column;
      min-height:0;
    }

    .card{
      background: var(--card);
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow);
      border-radius: var(--r);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .cardInner{ padding: 16px; }

    .card h2{
      margin:0 0 4px;
      font-size: 18px;
      letter-spacing:.2px;
    }
    .card .sub{
      margin:0 0 14px;
      color: var(--muted2);
      font-size: 13px;
    }

    /* ===== Login screen ===== */
    #loginScreen{
      min-height: calc(100vh - 48px);
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 10px 0;
    }

    .loginHero{
      width: min(640px, 96vw);
      text-align:center;
      margin-bottom: 14px;
    }
    .loginHero .big{
      font-size: clamp(44px, 6vw, 72px);
      font-weight: 900;
      letter-spacing: .4px;
      margin: 0;
      line-height: 1.02;
    }
    .loginHero .small{
      margin: 10px 0 0;
      font-size: 18px;
      color: rgba(255,255,255,.78);
      letter-spacing: .2px;
    }

    .loginBox{
      width: min(560px, 96vw);
      padding: 18px;
      text-align:left;
    }
    .loginBox .row{
      display:flex; gap: 10px;
      align-items:center;
      margin-top: 10px;
    }

    .field{
      width:100%;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 14px;
      padding: 12px 14px;
      color: var(--text);
      outline:none;
      font-size: 16px;
    }
    .field:focus{
      border-color: rgba(255,255,255,.28);
      box-shadow: 0 0 0 4px rgba(255,255,255,.07);
    }

    select.field{
      appearance:auto;
      -webkit-appearance:auto;
      -moz-appearance:auto;
    }
    select.field option{
      background: #0f131a;
      color: #ffffff;
    }

    .msg{
      margin-top: 10px;
      font-size: 14px;
      color: rgba(255,220,220,.92);
      display:none;
    }
    .msg.ok{ color: rgba(205,255,225,.92); }

    /* ===== Calendar ===== */
    .calHeader{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .monthTitle{
      display:flex;
      flex-direction:column;
      gap:3px;
    }
    .monthTitle .m{
      font-size: 18px;
      font-weight: 750;
      letter-spacing:.2px;
      text-transform: capitalize;
    }
    .monthTitle .t{
      font-size: 12px;
      color: var(--muted2);
    }
    .nav{
      display:flex; align-items:center; gap:10px;
    }
    .nav .btn{ padding: 10px 12px; min-width: 44px; }

    .weekdays{
      display:grid;
      grid-template-columns: repeat(6, 1fr) 1.35fr; /* gør søndag bredere */
      gap: 8px;
      margin-bottom: 8px;
      padding: 0 2px;
      color: rgba(255,255,255,.72);
      font-size: 12px;
    }
    .weekdays div{ text-align:center; }

    .days{
      display:grid;
      grid-template-columns: repeat(6, 1fr) 1.35fr; /* gør søndag bredere */
      gap: 10px;
      flex: 1;
      min-height:0;
    }

    .day{
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.05);
      border-radius: 14px;
      min-height: 92px;
      padding: 10px;
      display:flex;
      flex-direction:column;
      gap: 8px;
      cursor:pointer;
      transition: transform .06s ease, border-color .18s ease, background .18s ease;
      user-select:none;
      min-width:0;
    }
    .day:hover{ border-color: rgba(255,255,255,.18); background: rgba(255,255,255,.07); }
    .day:active{ transform: translateY(1px); }
    .day.muted{
      opacity: .38;
      cursor: default;
    }
    .day.muted:hover{ background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.10); }

    .dayTop{
      display:flex; justify-content:space-between; align-items:baseline;
      gap: 8px;
      min-width:0;
    }
    .num{ font-weight: 800; font-size: 14px; }
    .dow{ font-size: 12px; color: rgba(255,255,255,.70); }

    .pill{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.20);
      font-weight: 750;
      font-size: 12px;
      line-height: 1.15;
      letter-spacing:.2px;
      white-space: nowrap;
      max-width: 100%;
      overflow:hidden;
      text-overflow: ellipsis;
      min-width:0;
    }
    .pill.taastrup{ border-color: rgba(74,166,255,.55); background: rgba(74,166,255,.14); }
    .pill.horsens{ border-color: rgba(183,123,255,.55); background: rgba(183,123,255,.14); }
    .pill.birkeroed{ border-color: rgba(62,230,195,.55); background: rgba(62,230,195,.14); }
    .pill.booking{ border-color: rgba(45,212,122,.55); background: rgba(45,212,122,.16); }

    .pill.shift{
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
      border-radius: 14px;
      justify-content:flex-start;
      text-align:left;
    }

    .pill.overridden{
      opacity: .55;
      text-decoration: line-through;
      text-decoration-thickness: 2px;
      text-decoration-color: rgba(255,255,255,.55);
    }

    /* ===== Form ===== */
    .formGrid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .formGrid .full{ grid-column: 1 / -1; }

    label{
      display:block;
      margin: 10px 0 6px;
      font-size: 12px;
      color: rgba(255,255,255,.74);
    }
    textarea.field{
      min-height: 56px; /* mindre note-felt */
      resize: vertical;
    }

    .rowBtns{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-top: 12px;
    }

    .status{
      margin-top: 10px;
      font-size: 13px;
      color: rgba(205,255,225,.92);
      display:none;
    }

    .list{
      margin-top: 12px;
      display:flex;
      flex-direction:column;
      gap: 10px;
      overflow:auto;
      padding-right: 2px;
    }
    .item{
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.05);
      border-radius: 14px;
      padding: 12px;
      display:flex;
      justify-content:space-between;
      gap: 10px;
      align-items:flex-end;
    }
    .item .meta{
      display:flex; flex-direction:column; gap: 6px;
      min-width: 0;
    }
    .item .meta .who{
      font-weight: 800;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
    }
    .item .meta .dates{
      color: rgba(255,255,255,.70);
      font-size: 12px;
    }
    .item .meta .by{
      color: rgba(255,255,255,.72);
      font-size: 12px;
    }
    .item .meta .note{
      color: rgba(255,255,255,.74);
      font-size: 12px;
      line-height: 1.25;
      white-space: normal;
      word-break: break-word;
    }

    .actions{
      display:flex;
      gap:8px;
      align-items:center;
      justify-content:flex-end;
      flex-wrap: wrap;
    }

    .danger{
      border-color: rgba(255,100,100,.35);
      background: rgba(255,60,60,.10);
    }

    /* ===== Simple dropdown for "Yderligere info" ===== */
    .menuWrap{
      position:relative;
      display:inline-block;
    }
    .menuPanel{
      position:absolute;
      right:0;
      top: calc(100% + 10px);
      width: min(360px, 86vw);
      background: rgba(10,12,16,.92);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 14px;
      box-shadow: 0 18px 50px rgba(0,0,0,.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 10px;
      z-index: 50;
      display:none;
    }
    .menuPanel.open{ display:block; }

    .menuItem{
      width:100%;
      text-align:left;
      padding: 10px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      color: var(--text);
      cursor:pointer;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .menuItem:hover{
      background: rgba(255,255,255,.08);
      border-color: rgba(255,255,255,.18);
    }
    .menuItemRow{
      display:flex;
      gap:8px;
      align-items:center;
      justify-content:space-between;
      margin-bottom:8px;
    }
    .menuItemRow .menuItem{ margin-bottom:0; }
    .menuMiniBtn{
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.06);
      color: var(--text);
      cursor:pointer;
      font-weight: 750;
    }
    .menuMiniBtn:hover{ background: rgba(255,255,255,.10); }

    /* ===== Modal ===== */
    .modalBack{
      position:fixed; inset:0;
      background: rgba(0,0,0,.55);
      display:none;
      align-items:center;
      justify-content:center;
      z-index: 80;
      padding: 14px;
    }
    .modalBack.open{ display:flex; }
    .modal{
      width: min(760px, 96vw);
      max-height: min(82vh, 860px);
      overflow:auto;
      background: rgba(10,12,16,.92);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(0,0,0,.60);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 16px;
    }
    .modalHeader{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      margin-bottom: 10px;
    }
    .modalHeader h3{
      margin:0;
      font-size: 18px;
      letter-spacing:.2px;
    }
    .modalBody{
      color: rgba(255,255,255,.86);
      font-size: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    @media (max-width: 980px){
      .grid{ grid-template-columns: 1fr; }
      #app{ min-height: auto; }
      #app > .card{ height:auto; }
      .weekdays, .days{
        grid-template-columns: repeat(7, 1fr);
      }
    }

    .hidden{ display:none !important; }
  </style>
</head>

<body>
  <div class="bg"></div>

  <div class="wrap">
    <!-- Header vises kun når man er logget ind -->
    <header id="appHeader" class="hidden">
      <div class="title">
        <h1 id="headerTitle">Samsøhuset</h1>
        <p>Kalender og eventuelle ændringer</p>
      </div>

      <div class="topActions">
        <div class="menuWrap">
          <button id="infoBtn" class="btn" type="button">Yderligere info</button>
          <div id="infoMenu" class="menuPanel"></div>
        </div>

        <button id="logoutBtn" class="btn" type="button">Log ud</button>
      </div>
    </header>

    <!-- LOGIN -->
    <section id="loginScreen">
      <div>
        <div class="loginHero">
          <h1 class="big">Samsøhuset</h1>
          <p class="small">Hvem og hvornår</p>
        </div>

        <div class="card loginBox">
          <div class="cardInner">
            <h2>Log ind</h2>
            <p class="sub">Indtast koden for at komme ind.</p>

            <div class="row">
              <input id="passInput" class="field" type="password" placeholder="Kode" autocomplete="current-password" />
              <button id="loginBtn" class="btn btnPrimary" type="button">Log ind</button>
            </div>

            <div id="loginMsg" class="msg"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- APP -->
    <main id="app" class="grid hidden">
      <!-- Calendar -->
      <section class="card">
        <div class="cardInner">
          <div class="calHeader">
            <div class="monthTitle">
              <div id="monthName" class="m">—</div>
              <div class="t">Klik på en dag for start. Klik igen for slut.</div>
            </div>
            <div class="nav">
              <button id="prevBtn" class="btn" type="button">◀</button>
              <button id="todayBtn" class="btn" type="button">I dag</button>
              <button id="nextBtn" class="btn" type="button">▶</button>
            </div>
          </div>

          <div class="weekdays">
            <div>Man</div><div>Tir</div><div>Ons</div><div>Tor</div><div>Fre</div><div>Lør</div><div>Søn</div>
          </div>

          <div id="days" class="days"></div>
        </div>
      </section>

      <!-- Booking panel -->
      <aside class="card">
        <div class="cardInner">
          <h2>Foretag ændringer</h2>
          <p class="sub">Vælg i kalenderen, eller udfyld felterne her.</p>

          <div class="formGrid">
            <div>
              <label for="startInput">Start</label>
              <input id="startInput" class="field" type="date" />
            </div>
            <div>
              <label for="endInput">Slut</label>
              <input id="endInput" class="field" type="date" />
            </div>

            <div class="full">
              <label for="whoInput">Hvem har huset (kan være familie/venner)</label>
              <input id="whoInput" class="field" type="text" placeholder="Fx Taastrup / Vennegruppe / etc." />
            </div>

            <div class="full">
              <label for="changedByInput">Ændret af</label>
              <input id="changedByInput" class="field" type="text" placeholder="Navn" />
            </div>

            <div class="full">
              <label for="visibilityInput">Synlighed</label>
              <select id="visibilityInput" class="field">
                <option value="">Vælg…</option>
                <option value="all">Ses af alle</option>
                <option value="taastrup">Kun Taastrup</option>
                <option value="horsens">Kun Horsens</option>
                <option value="birkeroed">Kun Birkerød</option>
              </select>
            </div>

            <div class="full">
              <label for="noteInput">Note (valgfri)</label>
              <textarea id="noteInput" class="field" placeholder="Kort note"></textarea>
            </div>
          </div>

          <div class="rowBtns">
            <button id="resetBtn" class="btn" type="button">Nulstil</button>
            <button id="saveBtn" class="btn btnPrimary" type="button">Gem</button>
          </div>

          <div id="status" class="status">—</div>

          <div style="margin-top:16px; display:flex; flex-direction:column; min-height:0;">
            <h2>Ændringer</h2>
            <p class="sub">Liste over ændringer</p>
            <div id="list" class="list"></div>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <!-- Modal for info pages -->
  <div id="modalBack" class="modalBack">
    <div class="modal">
      <div class="modalHeader">
        <h3 id="modalTitle">—</h3>
        <div class="actions">
          <button id="modalEditBtn" class="btn hidden" type="button">Rediger</button>
          <button id="modalDeleteBtn" class="btn danger hidden" type="button">Slet</button>
          <button id="modalCloseBtn" class="btn" type="button">Luk</button>
        </div>
      </div>

      <div id="modalBody" class="modalBody"></div>

      <div id="modalEditArea" class="hidden" style="margin-top:12px;">
        <label for="infoTitleInput">Titel</label>
        <input id="infoTitleInput" class="field" type="text" />

        <label for="infoContentInput">Indhold</label>
        <textarea id="infoContentInput" class="field" style="min-height:180px;"></textarea>

        <div class="rowBtns">
          <button id="modalCancelEditBtn" class="btn" type="button">Annuller</button>
          <button id="modalSaveEditBtn" class="btn btnPrimary" type="button">Gem</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    /* =========================================================
       KONFIGURATION
       ========================================================= */
    const SHARED_CODE = "kalkhavesvej";
    const ADMIN_CODES = ["Kalkhavesvej100!", "DLOGIN"];

    const FAMILY_CODES = {
      "taastrup": "Taastrup",
      "horsens": "Horsens",
      "birkeroed": "Birkerød"
    };

    const SUPABASE_URL = "https://jbweskxscyxjonrhbdcd.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_2qMwF5JFmVmQuf9jJCERxw_25bMzbyu";

    const YEAR = 2026;
    const ROTATION = ["Taastrup", "Horsens", "Birkerød"];
    const ROTATION_START_MONDAY = "2025-12-29";
    /* ========================================================= */

    const appHeader = document.getElementById("appHeader");
    const headerTitle = document.getElementById("headerTitle");

    const loginScreen = document.getElementById("loginScreen");
    const app = document.getElementById("app");
    const passInput = document.getElementById("passInput");
    const loginBtn = document.getElementById("loginBtn");
    const loginMsg = document.getElementById("loginMsg");
    const logoutBtn = document.getElementById("logoutBtn");

    const monthName = document.getElementById("monthName");
    const daysEl = document.getElementById("days");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const todayBtn = document.getElementById("todayBtn");

    const startInput = document.getElementById("startInput");
    const endInput = document.getElementById("endInput");
    const whoInput = document.getElementById("whoInput");
    const changedByInput = document.getElementById("changedByInput");
    const visibilityInput = document.getElementById("visibilityInput");
    const noteInput = document.getElementById("noteInput");
    const resetBtn = document.getElementById("resetBtn");
    const saveBtn = document.getElementById("saveBtn");
    const statusEl = document.getElementById("status");
    const listEl = document.getElementById("list");

    const infoBtn = document.getElementById("infoBtn");
    const infoMenu = document.getElementById("infoMenu");

    const modalBack = document.getElementById("modalBack");
    const modalTitle = document.getElementById("modalTitle");
    const modalBody = document.getElementById("modalBody");
    const modalCloseBtn = document.getElementById("modalCloseBtn");
    const modalEditBtn = document.getElementById("modalEditBtn");
    const modalDeleteBtn = document.getElementById("modalDeleteBtn");

    const modalEditArea = document.getElementById("modalEditArea");
    const infoTitleInput = document.getElementById("infoTitleInput");
    const infoContentInput = document.getElementById("infoContentInput");
    const modalCancelEditBtn = document.getElementById("modalCancelEditBtn");
    const modalSaveEditBtn = document.getElementById("modalSaveEditBtn");

    function getSupabaseClient(){
      if (!window.supabase || !window.supabase.createClient) return null;
      return window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    }

    function normalize(v){ return (v || "").toString().trim().toLowerCase(); }

    function setLoginMsg(text, ok=false){
      loginMsg.textContent = text;
      loginMsg.className = "msg" + (ok ? " ok" : "");
      loginMsg.style.display = "block";
    }
    function clearLoginMsg(){
      loginMsg.style.display = "none";
      loginMsg.textContent = "";
    }

    function setStatus(text, ok=true){
      statusEl.textContent = text;
      statusEl.style.display = "block";
      statusEl.style.color = ok ? "rgba(205,255,225,.92)" : "rgba(255,220,220,.92)";
      setTimeout(()=>{ statusEl.style.display = "none"; }, 2800);
    }

    function isLoggedIn(){ return localStorage.getItem("samsoehuset_ok") === "1"; }

    function detectRoleFromCode(codeRaw){
      const c = (codeRaw || "").toString().trim();
      const cNorm = normalize(c);

      if (!cNorm) return null;

      if (normalize(SHARED_CODE) === cNorm) return "guest";

      for (const a of ADMIN_CODES){
        if (normalize(a) === cNorm) return "admin";
      }

      for (const [role, code] of Object.entries(FAMILY_CODES)){
        if (normalize(code) === cNorm) return role;
      }

      return null;
    }

       Kalender logik
       ========================================================= */
    const DK_MONTHS = ["januar","februar","marts","april","maj","juni","juli","august","september","oktober","november","december"];
    const DK_DOW = ["Søn","Man","Tir","Ons","Tor","Fre","Lør"];

    let view = new Date(YEAR, 0, 1);
    view.setHours(12,0,0,0);

    let selectedStart = null;
    let selectedEnd = null;

    let infoPages = [];

    function isoDate(d){
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,"0");
      const da = String(d.getDate()).padStart(2,"0");
      return `${y}-${m}-${da}`;
    }
    function parseISO(s){
      const [y,m,d] = s.split("-").map(Number);
      const dt = new Date(y, m-1, d);
      dt.setHours(12,0,0,0);
      return dt;
    }
    function startOfDay(d){
      const x = new Date(d);
      x.setHours(12,0,0,0);
      return x;
    }
    function addDays(d, n){
      const x = new Date(d);
      x.setDate(x.getDate()+n);
      return startOfDay(x);
    }
    function clampDateOrder(a,b){
      if (!a || !b) return [a,b];
      return a <= b ? [a,b] : [b,a];
    }
    function sameDay(a,b){
      return a && b && a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
    }
    function inRange(day, a, b){
      if (!a || !b) return false;
      const d = day.getTime();
      return d >= a.getTime() && d <= b.getTime();
    }

    function tomorrowISO(){
      const t = addDays(startOfDay(new Date()), 1);
      return isoDate(t);
    }
    function isHistoricalStay(stay){
      const min = tomorrowISO();
      return (stay && stay.end_date && stay.end_date < min);
    }

    function mondayStart(d){
      const x = startOfDay(d);
      const js = x.getDay();
      const diff = (js === 0) ? -6 : (1 - js);
      return addDays(x, diff);
    }
    function weekIndexFromRotationStart(monday){
      const start = parseISO(ROTATION_START_MONDAY);
      const diffDays = Math.round((monday.getTime()-start.getTime())/(1000*60*60*24));
      return Math.floor(diffDays / 7);
    }

    function baseOwnerForDate(d){
      const mon = mondayStart(d);
      const w = weekIndexFromRotationStart(mon);
      const idx = ((w % ROTATION.length) + ROTATION.length) % ROTATION.length;
      const current = ROTATION[idx];
      const next = ROTATION[(idx+1) % ROTATION.length];

      if (d.getDay() === 0){
        return { type:"shift", current, next };
      }
      return { type:"single", owner: current };
    }

    function ownerClass(name){
      const n = (name||"").toLowerCase();
      if (n.includes("taastrup")) return "taastrup";
      if (n.includes("horsens")) return "horsens";
      if (n.includes("birker")) return "birkeroed";
      return "";
    }

    function canSeeStay(stay){
      if (!stay) return false;
      if (isAdmin()) return true;

      const role = getRole();
      const vis = (stay.visibility || "all").toString().toLowerCase();

      if (vis === "all" || vis === "") return true;
      if (role === "taastrup" && vis === "taastrup") return true;
      if (role === "horsens" && vis === "horsens") return true;
      if (role === "birkeroed" && vis === "birkeroed") return true;

      return false;
    }

    function canModifyStay(stay){
      if (!stay) return false;
      if (isAdmin()) return true;

      if (isHistoricalStay(stay)) return false;

      const role = getRole();
      const createdRole = (stay.created_role || "").toString().toLowerCase();
      return createdRole && role && createdRole === role;
    }

    function findVisibleStayForDate(d){
      const dayISO = isoDate(d);
      const matches = stays.filter(s => s.start_date <= dayISO && s.end_date >= dayISO);
      const visible = matches.filter(canSeeStay);
      return visible.length ? visible[0] : null;
    }

    function monthLabel(d){
      return `${DK_MONTHS[d.getMonth()]} ${d.getFullYear()}`;
    }

    function onDayClick(date){
      if (!selectedStart || (selectedStart && selectedEnd)){
        selectedStart = date;
        selectedEnd = null;
      } else {
        selectedEnd = date;
        [selectedStart, selectedEnd] = clampDateOrder(selectedStart, selectedEnd);
      }

      if (selectedStart) startInput.value = isoDate(selectedStart);
      if (selectedEnd) endInput.value = isoDate(selectedEnd);

      render();
    }

    function render(){
      monthName.textContent = monthLabel(view);

      const first = new Date(view.getFullYear(), view.getMonth(), 1);
      first.setHours(12,0,0,0);

      const firstMonday = mondayStart(first);
      const start = firstMonday;

      daysEl.innerHTML = "";
      for (let i=0; i<42; i++){
        const d = addDays(start, i);
        const inThisMonth = d.getMonth() === view.getMonth();

        const day = document.createElement("div");
        day.className = "day" + (inThisMonth ? "" : " muted");

        const top = document.createElement("div");
        top.className = "dayTop";

        const num = document.createElement("div");
        num.className = "num";
        num.textContent = String(d.getDate());

        const dow = document.createElement("div");
        dow.className = "dow";
        dow.textContent = DK_DOW[d.getDay()];

        top.appendChild(num);
        top.appendChild(dow);
        day.appendChild(top);

        const base = baseOwnerForDate(d);
        const visibleStay = findVisibleStayForDate(d);

        if (base.type === "shift"){
          // Søndag: farven skal tilhøre NÆSTE uge (base.next)
          const p = document.createElement("div");
          p.className = "pill shift " + ownerClass(base.next);
          p.textContent = `Skiftedag: ${base.current} → ${base.next}`;
          day.appendChild(p);
        } else {
          const p = document.createElement("div");
          p.className = "pill " + ownerClass(base.owner) + (visibleStay ? " overridden" : "");
          p.textContent = base.owner;
          day.appendChild(p);
        }

        if (visibleStay){
          const b = document.createElement("div");
          b.className = "pill booking";
          b.textContent = `Bruges af: ${visibleStay.family}`;
          day.appendChild(b);
        }

        if (selectedStart && sameDay(d, selectedStart)) {
          day.style.outline = "2px solid rgba(45,212,122,.85)";
          day.style.outlineOffset = "2px";
        }
        if (selectedEnd && sameDay(d, selectedEnd)) {
          day.style.outline = "2px solid rgba(45,212,122,.85)";
          day.style.outlineOffset = "2px";
        }
        if (selectedStart && selectedEnd && inRange(d, selectedStart, selectedEnd)){
          day.style.borderColor = "rgba(45,212,122,.35)";
          day.style.background = "rgba(45,212,122,.08)";
        }

        if (inThisMonth){
          day.addEventListener("click", ()=> onDayClick(d));
        }

        daysEl.appendChild(day);
      }
    }

    function resetForm(clearSelection=true){

    async function getOverlapCount(client, a, b, excludeId){
      let q = client
        .from("stays")
        .select("id", { count: "exact", head: true })
        .not("end_date", "lt", a)
        .not("start_date", "gt", b);

      if (excludeId != null){
        q = q.neq("id", excludeId);
      }

      const { count, error } = await q;
      if (error){
        console.error(error);
        return null;
      }
      return count || 0;
    }

    async function saveStay(){
      const s = startInput.value;
      const e = endInput.value;
      const who = (whoInput.value || "").trim();
      const changedBy = (changedByInput.value || "").trim();
      const vis = (visibilityInput.value || "").trim();
      const note = (noteInput.value || "").trim();

      if (!s || !e){
        setStatus("Vælg både start og slut.", false);
        return;
      }
      if (!who){
        setStatus("Skriv hvem der har huset.", false);
        return;
      }
      if (!changedBy){
        setStatus("Skriv hvem der har ændret.", false);
        return;
      }
      if (!vis){
        setStatus("Vælg synlighed.", false);
        return;
      }

      const [a,b] = clampDateOrder(s, e);
      const min = tomorrowISO();
      if (a < min || b < min){
        setStatus("Du kan kun lave ændringer fra i morgen og frem.", false);
        return;
      }

      const client = getSupabaseClient();
      if (!client){
        setStatus("Kunne ikke forbinde.", false);
        return;
      }

      const overlapCount = await getOverlapCount(client, a, b, editingStayId);
      if (overlapCount == null){
        setStatus("Kunne ikke validere datoer.", false);
        return;
      }
      if (overlapCount > 0){
        setStatus("Der findes allerede en ændring i den periode. Slet eller redigér den først.", false);
        return;
      }

      const role = getRole();
      const payload = {
        start_date: a,
        end_date: b,
        family: who,
        booked_by: changedBy,
        note: note,
        visibility: vis,
        created_role: role // kræver kolonnen created_role i stays
      };

      if (editingStayId){
        const current = stays.find(x => String(x.id) === String(editingStayId));
        if (current && !canModifyStay(current)){
          setStatus("Du kan ikke redigere denne ændring.", false);
          return;
        }

        const { error } = await client
          .from("stays")
          .update(payload)
          .eq("id", editingStayId);

        if (error){
          setStatus("Kunne ikke gemme ændring.", false);
          console.error(error);
          return;
        }

        setStatus("Opdateret ✅");
      } else {
        const { error } = await client.from("stays").insert(payload);
        if (error){
          setStatus("Kunne ikke gemme.", false);
          console.error(error);
          return;
        }
        setStatus("Gemt ✅");
      }

      resetForm(false);
      await loadStays();
    }

    function formatVisibility(v){
      const x = (v || "all").toString().toLowerCase();
      if (x === "all") return "alle";
      if (x === "taastrup") return "kun Taastrup";
      if (x === "horsens") return "kun Horsens";
      if (x === "birkeroed") return "kun Birkerød";

    }

      selectedStart = stay.start_date ? parseISO(stay.start_date) : null;
      selectedEnd = stay.end_date ? parseISO(stay.end_date) : null;
      render();
    }

    async function deleteStay(id){
      const stay = stays.find(x => String(x.id) === String(id));
      if (!stay){
        setStatus("Kunne ikke finde ændringen.", false);
        return;
      }

      if (!canModifyStay(stay)){
        setStatus("Du kan ikke slette denne ændring.", false);
        return;
      }

      const who = (stay.booked_by || "-").toString().trim() || "-";
      const ok = confirm(`OBS. Denne ændring er lavet af ${who}\n\nHvis du sletter denne ændring, forsvinder den permanent og kan ikke genskabes.\n\nVil du slette?`);
      if (!ok) return;

      const client = getSupabaseClient();
      if (!client){
        setStatus("Kunne ikke forbinde.", false);
        return;
      }

      const { error } = await client.from("stays").delete().eq("id", id);
      if (error){
        setStatus("Kunne ikke slette.", false);
        console.error(error);
        return;
      }
      setStatus("Slettet");
      await loadStays();
    }

    function renderList(){
      listEl.innerHTML = "";

      const visibleList = isAdmin() ? stays : stays.filter(canSeeStay);

      if (!visibleList.length){
        const empty = document.createElement("div");
        empty.className = "item";
        empty.innerHTML = `<div class="meta"><div class="who">Ingen ændringer endnu</div><div class="dates">—</div></div>`;
        listEl.appendChild(empty);
        return;
      }

      const sorted = [...visibleList].sort((a,b)=>{
        const aa = (a.created_at || "");
        const bb = (b.created_at || "");
        return bb.localeCompare(aa);
      });

      for (const s of sorted){
        const it = document.createElement("div");
        it.className = "item";

        const meta = document.createElement("div");
        meta.className = "meta";

        const who = document.createElement("div");
        who.className = "who";
        who.textContent = s.family || "(ukendt)";

        const dates = document.createElement("div");
        dates.className = "dates";
        dates.textContent = `${s.start_date} → ${s.end_date}`;

        const by = document.createElement("div");
        by.className = "by";
        by.textContent = `Ændret af: ${s.booked_by || "-"}`;

        const vis = document.createElement("div");
        vis.className = "by";
        vis.textContent = `Synlig: ${formatVisibility(s.visibility)}`;

        meta.appendChild(who);
        meta.appendChild(dates);
        meta.appendChild(by);
        meta.appendChild(vis);

        if (s.note && String(s.note).trim()){
          const note = document.createElement("div");
          note.className = "note";
          note.textContent = `Note: ${String(s.note).trim()}`;
          meta.appendChild(note);
        }

        const actions = document.createElement("div");
        actions.className = "actions";

        const canMod = canModifyStay(s);

        if (canMod){
          const edit = document.createElement("button");
          edit.className = "btn";
          edit.type = "button";
          edit.textContent = "Rediger";
          edit.addEventListener("click", ()=> startEditStay(s));
          actions.appendChild(edit);

          const del = document.createElement("button");
          del.className = "btn danger";
          del.type = "button";
          del.textContent = "Slet";
          del.addEventListener("click", ()=> deleteStay(s.id));
          actions.appendChild(del);
        }

        it.appendChild(meta);
        it.appendChild(actions);

        listEl.appendChild(it);
      }
    }

    async function loadStays(){
      const client = getSupabaseClient();
      if (!client){
        setStatus("Kunne ikke forbinde lige nu. Prøv at genindlæse.", false);
        return;

      const { data, error } = await client

        .select("*")

      stays = Array.isArray(data) ? data : [];
      render();

    }

    });

    async function loadInfoPages(){
      const client = getSupabaseClient();
      if (!client){
        return;
      }

      const { data, error } = await client
        .from("info_pages")
        .select("*")
        .order("sort_order", { ascending: true, nullsFirst: false })
        .order("created_at", { ascending: true });

      if (error){
        console.error(error);
        infoPages = [];
        renderInfoMenu();
        return;
      }

      infoPages = Array.isArray(data) ? data : [];
      renderInfoMenu();
    }

    async function loadAll(){
      updateHeaderTitle();
      await Promise.all([loadStays(), loadInfoPages()]);
    }

    /* =========================================================
       Init
       ========================================================= */
    (function init(){
      if (isLoggedIn()){
        showApp();
        updateHeaderTitle();
        loadAll();
      } else {
        showLogin();
      }

      render();
      renderList();
      renderInfoMenu();
    })();
  </script>
</body>
</html>
