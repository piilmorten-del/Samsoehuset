<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Samsøhuset</title>

  <style>
    :root{
      --bg:#0b0f14;
      --card: rgba(15,18,22,.78);
      --stroke: rgba(255,255,255,.10);
      --stroke2: rgba(255,255,255,.16);
      --text:#f3f5f7;
      --muted: rgba(255,255,255,.70);
      --muted2: rgba(255,255,255,.55);
      --green:#2dd47a;
      --blue:#4aa6ff;
      --purple:#b77bff;
      --teal:#3ee6c3;
      --shadow: 0 18px 50px rgba(0,0,0,.55);
      --r: 18px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; margin:0; }
    body{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      overflow-x:hidden;
    }

    .bg{
      position:fixed; inset:0;
      background-image: url("bg.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: saturate(1.05) contrast(1.05);
      transform: scale(1.02);
    }
    .bg::after{
      content:"";
      position:absolute; inset:0;
      background: radial-gradient(1000px 700px at 25% 15%, rgba(0,0,0,.25), rgba(0,0,0,.75)),
                  linear-gradient(180deg, rgba(0,0,0,.40), rgba(0,0,0,.70));
    }

    .wrap{
      position:relative;
      min-height:100%;
      padding: 22px 22px 34px;
    }

    header{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
      margin-bottom: 16px;
    }
    .title h1{
      margin:0;
      font-size: clamp(28px, 4vw, 44px);
      letter-spacing: .2px;
      line-height: 1.05;
    }
    .title p{
      margin:6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .topActions{
      display:flex; align-items:center; gap:10px;
      position:relative;
    }

    .btn{
      border: 1px solid var(--stroke2);
      background: rgba(255,255,255,.06);
      color: var(--text);
      border-radius: 14px;
      padding: 10px 14px;
      font-weight: 650;
      cursor:pointer;
      transition: transform .08s ease, background .18s ease, border-color .18s ease;
      user-select:none;
    }
    .btn:hover{ background: rgba(255,255,255,.10); border-color: rgba(255,255,255,.22); }
    .btn:active{ transform: translateY(1px); }
    .btnPrimary{
      border-color: rgba(45,212,122,.45);
      background: rgba(45,212,122,.14);
    }
    .btnPrimary:hover{ background: rgba(45,212,122,.20); border-color: rgba(45,212,122,.62); }

    /* Layout: kalender bredere, panel smallere */
    .grid{
      display:grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(300px, .65fr);
      gap: 16px;
      align-items:stretch;
    }

    .card{
      background: var(--card);
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow);
      border-radius: var(--r);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .cardInner{ padding: 16px; }

    .card h2{
      margin:0 0 4px;
      font-size: 18px;
      letter-spacing:.2px;
    }
    .card .sub{
      margin:0 0 14px;
      color: var(--muted2);
      font-size: 13px;
    }

    /* ===== Login screen ===== */
    #loginScreen{
      min-height: calc(100vh - 48px);
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 10px 0;
    }

    .loginHero{
      width: min(640px, 96vw);
      text-align:center;
      margin-bottom: 14px;
    }
    .loginHero .big{
      font-size: clamp(44px, 6vw, 72px);
      font-weight: 900;
      letter-spacing: .4px;
      margin: 0;
      line-height: 1.02;
    }
    .loginHero .small{
      margin: 10px 0 0;
      font-size: 18px;
      color: rgba(255,255,255,.78);
      letter-spacing: .2px;
    }

    .loginBox{
      width: min(560px, 96vw);
      padding: 18px;
      text-align:left;
    }
    .loginBox .row{
      display:flex; gap: 10px;
      align-items:center;
      margin-top: 10px;
    }

    .field{
      width:100%;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 14px;
      padding: 12px 14px;
      color: var(--text);
      outline:none;
      font-size: 16px;
    }
    .field:focus{
      border-color: rgba(255,255,255,.28);
      box-shadow: 0 0 0 4px rgba(255,255,255,.07);
    }

    /* Select dropdown læsbarhed */
    select.field{
      appearance:auto;
      -webkit-appearance:auto;
      -moz-appearance:auto;
    }
    select.field option{
      background: #0f141b;
      color: #f3f5f7;
    }

    .msg{
      margin-top: 10px;
      font-size: 14px;
      color: rgba(255,220,220,.92);
      display:none;
    }
    .msg.ok{ color: rgba(205,255,225,.92); }

    /* ===== Calendar ===== */
    .calHeader{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .monthTitle{
      display:flex;
      flex-direction:column;
      gap:3px;
    }
    .monthTitle .m{
      font-size: 18px;
      font-weight: 750;
      letter-spacing:.2px;
      text-transform: capitalize;
    }
    .monthTitle .t{
      font-size: 12px;
      color: var(--muted2);
    }
    .nav{
      display:flex; align-items:center; gap:10px;
    }
    .nav .btn{ padding: 10px 12px; min-width: 44px; }

    .weekdays{
      display:grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      margin-bottom: 8px;
      padding: 0 2px;
      color: rgba(255,255,255,.72);
      font-size: 12px;
    }
    .weekdays div{ text-align:center; }

    .days{
      display:grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
    }
    .day{
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.05);
      border-radius: 14px;
      min-height: 92px;
      padding: 10px;
      display:flex;
      flex-direction:column;
      gap: 8px;
      cursor:pointer;
      transition: transform .06s ease, border-color .18s ease, background .18s ease;
      user-select:none;
      overflow: visible; /* vigtigt: så søndags-pill ikke klippes */
      position:relative;
    }
    .day:hover{ border-color: rgba(255,255,255,.18); background: rgba(255,255,255,.07); }
    .day:active{ transform: translateY(1px); }
    .day.muted{
      opacity: .38;
      cursor: default;
    }
    .day.muted:hover{ background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.10); }
    .dayTop{
      display:flex; justify-content:space-between; align-items:baseline;
      gap: 8px;
    }
    .num{ font-weight: 800; font-size: 14px; }
    .dow{ font-size: 12px; color: rgba(255,255,255,.70); }

    .pill{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.20);
      font-weight: 750;
      font-size: 12px;
      line-height: 1;
      letter-spacing:.2px;
      white-space: nowrap;
      max-width: 100%;
      overflow:hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    .pill.taastrup{ border-color: rgba(74,166,255,.55); background: rgba(74,166,255,.14); }
    .pill.horsens{ border-color: rgba(183,123,255,.55); background: rgba(183,123,255,.14); }
    .pill.birkeroed{ border-color: rgba(62,230,195,.55); background: rgba(62,230,195,.14); }
    .pill.booking{ border-color: rgba(45,212,122,.55); background: rgba(45,212,122,.16); }

    /* Søndag skifte-pill: skal være fuldt læsbar */
    .pill.shiftday{
      font-size: 11px;
      padding: 7px 12px;
      white-space: nowrap;
      overflow: visible;
      text-overflow: clip;
      max-width: 100%;
    }

    .pill.strike{
      text-decoration: line-through;
      opacity: .55;
    }

    .shiftWrap{
      display:flex;
      flex-direction:column;
      gap: 6px;
    }
    .shiftNames{
      display:flex;
      flex-direction:column;
      gap: 6px;
    }

    /* ===== Form ===== */
    .formGrid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .formGrid .full{ grid-column: 1 / -1; }

    label{
      display:block;
      margin: 10px 0 6px;
      font-size: 12px;
      color: rgba(255,255,255,.74);
    }
    textarea.field{
      min-height: 58px; /* note mindre */
      resize: vertical;
    }

    .rowBtns{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-top: 12px;
    }

    .status{
      margin-top: 10px;
      font-size: 13px;
      color: rgba(205,255,225,.92);
      display:none;
      white-space: pre-line;
    }

    .listHeaderRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
    }

    .list{
      margin-top: 12px;
      display:flex;
      flex-direction:column;
      gap: 10px;
    }
    .item{
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.05);
      border-radius: 14px;
      padding: 12px;
      display:flex;
      justify-content:space-between;
      gap: 10px;
      align-items:flex-end;
    }
    .item .meta{
      display:flex; flex-direction:column; gap: 6px;
      min-width: 0;
    }
    .item .meta .who{
      font-weight: 800;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
    }
    .item .meta .dates{
      color: rgba(255,255,255,.70);
      font-size: 12px;
    }
    .item .meta .by{
      color: rgba(255,255,255,.72);
      font-size: 12px;
    }
    .item .meta .note{
      color: rgba(255,255,255,.74);
      font-size: 12px;
      line-height: 1.25;
      white-space: normal;
      word-break: break-word;
    }

    .btnRow{
      display:flex;
      gap:8px;
      align-items:center;
    }

    .danger{
      border-color: rgba(255,100,100,.35);
      background: rgba(255,60,60,.10);
    }

    @media (max-width: 980px){
      .grid{ grid-template-columns: 1fr; }
    }

    .hidden{ display:none !important; }

    /* ===== Modal ===== */
    .modalBack{
      position:fixed;
      inset:0;
      background: rgba(0,0,0,.55);
      display:none;
      align-items:center;
      justify-content:center;
      padding: 18px;
      z-index: 50;
    }
    .modalBack.show{ display:flex; }
    .modal{
      width: min(620px, 96vw);
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(15,18,22,.92);
      box-shadow: 0 18px 50px rgba(0,0,0,.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      overflow:hidden;
    }
    .modal .head{
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255,255,255,.10);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
    }
    .modal .head .h{
      font-weight: 850;
      letter-spacing:.2px;
    }
    .modal .body{
      padding: 16px;
    }
    .modal .foot{
      padding: 14px 16px;
      border-top: 1px solid rgba(255,255,255,.10);
      display:flex;
      justify-content:flex-end;
      gap:10px;
    }

    /* Dropdown for Yderligere info */
    .dropMenu{
      position:absolute;
      top: 48px;
      right: 0;
      min-width: 260px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(15,18,22,.92);
      box-shadow: 0 18px 50px rgba(0,0,0,.65);
      display:none;
      overflow:hidden;
      z-index: 30;
    }
    .dropMenu.show{ display:block; }
    .dropMenu button{
      width:100%;
      text-align:left;
      border:0;
      background: transparent;
      padding: 10px 12px;
      color: var(--text);
      cursor:pointer;
      font-weight: 650;
    }
    .dropMenu button:hover{
      background: rgba(255,255,255,.08);
    }
    .dropMenu .sep{
      height:1px;
      background: rgba(255,255,255,.10);
    }
  </style>
</head>

<body>
  <div class="bg"></div>

  <div class="wrap">

    <header id="appHeader" class="hidden">
      <div class="title">
        <h1 id="welcomeTitle">Samsøhuset</h1>
        <p>Kalender og eventuelle ændringer</p>
      </div>

      <div class="topActions">
        <button id="extraBtn" class="btn" type="button">Yderligere info</button>
        <div id="extraMenu" class="dropMenu"></div>
        <button id="logoutBtn" class="btn" type="button">Log ud</button>
      </div>
    </header>

    <!-- LOGIN -->
    <section id="loginScreen">
      <div>
        <div class="loginHero">
          <h1 class="big याद" style="margin:0;">Samsøhuset</h1>
          <p class="small">Hvem og hvornår</p>
        </div>

        <div class="card loginBox">
          <div class="cardInner">
            <h2>Log ind</h2>
            <p class="sub">Indtast koden for at komme ind.</p>

            <div class="row">
              <input id="passInput" class="field" type="password" placeholder="Kode" autocomplete="current-password" />
              <button id="loginBtn" class="btn btnPrimary" type="button">Log ind</button>
            </div>

            <div id="loginMsg" class="msg"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- APP -->
    <main id="app" class="grid hidden">

      <!-- Calendar -->
      <section class="card">
        <div class="cardInner">
          <div class="calHeader">
            <div class="monthTitle">
              <div id="monthName" class="m">—</div>
              <div class="t">Klik på en dag for start. Klik igen for slut.</div>
            </div>
            <div class="nav">
              <button id="prevBtn" class="btn" type="button">◀</button>
              <button id="todayBtn" class="btn" type="button">I dag</button>
              <button id="nextBtn" class="btn" type="button">▶</button>
            </div>
          </div>

          <div class="weekdays">
            <div>Man</div><div>Tir</div><div>Ons</div><div>Tor</div><div>Fre</div><div>Lør</div><div>Søn</div>
          </div>

          <div id="days" class="days"></div>
        </div>
      </section>

      <!-- Booking panel -->
      <aside class="card">
        <div class="cardInner">
          <h2>Foretag ændringer</h2>
          <p class="sub">Vælg i kalenderen, eller udfyld felterne her.</p>

          <div class="formGrid">
            <div>
              <label for="startInput">Start</label>
              <input id="startInput" class="field" type="date" />
            </div>
            <div>
              <label for="endInput">Slut</label>
              <input id="endInput" class="field" type="date" />
            </div>

            <div class="full">
              <label for="whoInput">Hvem har huset (kan være familie/venner)</label>
              <input id="whoInput" class="field" type="text" placeholder="Fx Taastrup / Vennegruppe / etc." />
            </div>

            <div class="full">
              <label for="changedByInput">Ændret af</label>
              <input id="changedByInput" class="field" type="text" placeholder="Navn" />
            </div>

            <div class="full">
              <label for="visibilityInput">Synlighed</label>
              <select id="visibilityInput" class="field">
                <option value="">Vælg...</option>
              </select>
            </div>

            <div class="full">
              <label for="noteInput">Note (valgfri)</label>
              <textarea id="noteInput" class="field" placeholder="Kort note"></textarea>
            </div>
          </div>

          <div class="rowBtns">
            <button id="resetBtn" class="btn" type="button">Nulstil</button>
            <button id="saveBtn" class="btn btnPrimary" type="button">Gem</button>
          </div>

          <div id="status" class="status">—</div>

          <div style="margin-top:16px">
            <div class="listHeaderRow">
              <div>
                <h2 style="margin:0 0 4px;">Ændringer</h2>
                <p class="sub" style="margin:0;">Liste over ændringer</p>
              </div>
              <button id="toggleHistoryBtn" class="btn" type="button">Vis historiske ændringer</button>
            </div>

            <div id="list" class="list"></div>
          </div>
        </div>
      </aside>

    </main>
  </div>

  <!-- Modal: confirm / edit / extra info -->
  <div id="modalBack" class="modalBack" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="head">
        <div id="modalTitle" class="h">—</div>
        <button id="modalClose" class="btn" type="button">Luk</button>
      </div>
      <div id="modalBody" class="body"></div>
      <div id="modalFoot" class="foot"></div>
    </div>
  </div>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    /* =========================================================
       KONFIGURATION
       ========================================================= */
    const SHARED_CODE = "kalkhavesvej";
    const ADMIN_CODE = "Kalkhavesvej100!";
    const FAMILY_CODES = {
      "Taastrup": "Taastrup",
      "Horsens": "Horsens",
      "Birkerød": "Birkerød"
    };

    const SUPABASE_URL = "https://jbweskxscyxjonrhbdcd.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_2qMwF5JFmVmQuf9jJCERxw_25bMzbyu";

    const YEAR = 2026;
    const ROTATION = ["Taastrup", "Horsens", "Birkerød"];
    const ROTATION_START_MONDAY = "2025-12-29";

    /* ========================================================= */

    const appHeader = document.getElementById("appHeader");
    const welcomeTitle = document.getElementById("welcomeTitle");

    const loginScreen = document.getElementById("loginScreen");
    const app = document.getElementById("app");
    const passInput = document.getElementById("passInput");
    const loginBtn = document.getElementById("loginBtn");
    const loginMsg = document.getElementById("loginMsg");
    const logoutBtn = document.getElementById("logoutBtn");

    const extraBtn = document.getElementById("extraBtn");
    const extraMenu = document.getElementById("extraMenu");

    const monthName = document.getElementById("monthName");
    const daysEl = document.getElementById("days");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const todayBtn = document.getElementById("todayBtn");

    const startInput = document.getElementById("startInput");
    const endInput = document.getElementById("endInput");
    const whoInput = document.getElementById("whoInput");
    const changedByInput = document.getElementById("changedByInput");
    const visibilityInput = document.getElementById("visibilityInput");
    const noteInput = document.getElementById("noteInput");
    const resetBtn = document.getElementById("resetBtn");
    const saveBtn = document.getElementById("saveBtn");
    const statusEl = document.getElementById("status");
    const listEl = document.getElementById("list");
    const toggleHistoryBtn = document.getElementById("toggleHistoryBtn");

    const modalBack = document.getElementById("modalBack");
    const modalTitle = document.getElementById("modalTitle");
    const modalBody = document.getElementById("modalBody");
    const modalFoot = document.getElementById("modalFoot");
    const modalClose = document.getElementById("modalClose");

    function getSupabaseClient(){
      if (!window.supabase || !window.supabase.createClient) return null;
      return window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    }

    function normalize(v){ return (v || "").toString().trim().toLowerCase(); }

    function setLoginMsg(text, ok=false){
      loginMsg.textContent = text;
      loginMsg.className = "msg" + (ok ? " ok" : "");
      loginMsg.style.display = "block";
    }
    function clearLoginMsg(){
      loginMsg.style.display = "none";
      loginMsg.textContent = "";
    }

    function setStatus(text, ok=true){
      statusEl.textContent = text;
      statusEl.style.display = "block";
      statusEl.style.color = ok ? "rgba(205,255,225,.92)" : "rgba(255,220,220,.92)";
      setTimeout(()=>{ statusEl.style.display = "none"; }, 3000);
    }

    function openModal(title, bodyNodeOrHtml, buttons){
      modalTitle.textContent = title;
      modalBody.innerHTML = "";
      if (typeof bodyNodeOrHtml === "string"){
        modalBody.innerHTML = bodyNodeOrHtml;
      } else if (bodyNodeOrHtml){
        modalBody.appendChild(bodyNodeOrHtml);
      }

      modalFoot.innerHTML = "";
      (buttons || []).forEach(b=>{
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "btn" + (b.primary ? " btnPrimary" : "") + (b.danger ? " danger" : "");
        btn.textContent = b.text;
        btn.addEventListener("click", b.onClick);
        modalFoot.appendChild(btn);
      });

      modalBack.classList.add("show");
      modalBack.setAttribute("aria-hidden", "false");
    }
    function closeModal(){
      modalBack.classList.remove("show");
      modalBack.setAttribute("aria-hidden", "true");
    }
    modalClose.addEventListener("click", closeModal);
    modalBack.addEventListener("click", (e)=>{
      if (e.target === modalBack) closeModal();
    });

    /* ===== Login roller ===== */
    const ROLE_KEY = "samsoehuset_role";
    const OK_KEY = "samsoehuset_ok";

    function isLoggedIn(){ return localStorage.getItem(OK_KEY) === "1"; }
    function getRole(){ return localStorage.getItem(ROLE_KEY) || ""; }
    function isAdmin(){ return getRole() === "admin"; }
    function isFamilyRole(){
      const r = getRole();
      return r === "Taastrup" || r === "Horsens" || r === "Birkerød";
    }

    function setLoggedIn(role){
      localStorage.setItem(OK_KEY, "1");
      localStorage.setItem(ROLE_KEY, role);
      showApp();
      applyRoleUI();
    }
    function setLoggedOut(){
      localStorage.removeItem(OK_KEY);
      localStorage.removeItem(ROLE_KEY);
      showLogin();
    }

    function showLogin(){
      appHeader.classList.add("hidden");
      loginScreen.classList.remove("hidden");
      app.classList.add("hidden");
    }
    function showApp(){
      appHeader.classList.remove("hidden");
      loginScreen.classList.add("hidden");
      app.classList.remove("hidden");
    }

    function resolveRoleFromCode(codeRaw){
      const code = (codeRaw || "").trim();
      if (!code) return null;

      if (code === ADMIN_CODE) return "admin";

      const n = normalize(code);
      if (n === normalize(SHARED_CODE)) return "shared";

      for (const fam in FAMILY_CODES){
        if ((FAMILY_CODES[fam] || "").trim() === code){
          return fam;
        }
      }
      return null;
    }

    function tryLogin(){

      const role = resolveRoleFromCode(entered);

      if (!entered){
        setLoginMsg("Skriv koden først.");
        return;
      }
      if (!role){
        setLoginMsg("Forkert kode. Prøv igen.");
        return;
      }

      setLoggedIn(role);
      loadStays();
      render();
      renderList();
    }

    loginBtn.addEventListener("click", tryLogin);
    passInput.addEventListener("keydown", (e)=>{ if (e.key === "Enter") tryLogin(); });
    logoutBtn.addEventListener("click", ()=>{ setLoggedOut(); });

    function roleLabel(){

      if (r === "admin") return "Administrator";
      if (r === "shared") return "Gæst";
      if (r) return r + " familien";

    }

    /* ===== Kalender ===== */
    const DK_MONTHS = ["januar","februar","marts","april","maj","juni","juli","august","september","oktober","november","december"];
    const DK_DOW = ["Søn","Man","Tir","Ons","Tor","Fre","Lør"];

    let view = new Date(YEAR, 0, 1);
    view.setHours(12,0,0,0);

    let selectedStart = null;
    let selectedEnd = null;

    let stays = [];
    let showHistory = false;

    function isoDate(d){
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,"0");
      const da = String(d.getDate()).padStart(2,"0");
      return `${y}-${m}-${da}`;
    }
    function parseISO(s){
      const [y,m,d] = s.split("-").map(Number);
      const dt = new Date(y, m-1, d);
      dt.setHours(12,0,0,0);
      return dt;
    }
    function startOfDay(d){
      const x = new Date(d);
      x.setHours(12,0,0,0);
      return x;
    }
    function addDays(d, n){
      const x = new Date(d);
      x.setDate(x.getDate()+n);
      return startOfDay(x);
    }
    function clampDateOrder(a,b){
      if (!a || !b) return [a,b];
      return a <= b ? [a,b] : [b,a];
    }
    function sameDay(a,b){
      return a && b && a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
    }
    function inRange(day, a, b){
      if (!a || !b) return false;
      const d = day.getTime();
      return d >= a.getTime() && d <= b.getTime();
    }

    function mondayStart(d){
      const x = startOfDay(d);
      const js = x.getDay();
      const diff = (js === 0) ? -6 : (1 - js);
      return addDays(x, diff);
    }
    function weekIndexFromRotationStart(monday){
      const start = parseISO(ROTATION_START_MONDAY);
      const diffDays = Math.round((monday.getTime()-start.getTime())/(1000*60*60*24));
      return Math.floor(diffDays / 7);
    }

    function baseOwnerForDate(d){
      const mon = mondayStart(d);
      const w = weekIndexFromRotationStart(mon);
      const idx = ((w % ROTATION.length) + ROTATION.length) % ROTATION.length;
      const current = ROTATION[idx];
      const next = ROTATION[(idx+1) % ROTATION.length];

      if (d.getDay() === 0){
        // søndag = skiftedag, men farven skal følge NÆSTE uge (next)
        return { type:"shift", current, next };
      }
      return { type:"single", owner: current };
    }

    function ownerClass(name){
      const n = (name||"").toLowerCase();
      if (n.includes("taastrup")) return "taastrup";
      if (n.includes("horsens")) return "horsens";
      if (n.includes("birker")) return "birkeroed";
      return "";
    }

    function getViewerRoleForVisibility(){
      if (isAdmin()) return "admin";
      const r = getRole();
      if (r === "Taastrup" || r === "Horsens" || r === "Birkerød") return r;
      return "shared";
    }

    function canViewerSeeStay(stay){
      if (!stay) return false;
      const vis = (stay.visibility || "all").toString();
      if (isAdmin()) return true;
      const viewer = getViewerRoleForVisibility();
      if (vis === "all") return true;
      return viewer === vis;
    }

    function isHistorical(stay){
      if (!stay) return false;
      const today = startOfDay(new Date());
      const end = parseISO(stay.end_date);
      return end.getTime() < today.getTime();
    }

    function canEditOrDeleteStay(stay){
      if (!stay) return false;

      if (isAdmin()){
        // admin må altid redigere/slette, også historiske
        return true;
      }

      // shared har ingen rettigheder
      if (!isFamilyRole()) return false;

      // familie må kun redigere/slette egne ændringer, og kun hvis ikke historisk
      if (stay.created_role !== getRole()) return false;
      if (isHistorical(stay)) return false;
      return true;
    }

    function findStayForDateVisible(d){
      const dayISO = isoDate(d);
      const match = stays.find(s => s.start_date <= dayISO && s.end_date >= dayISO) || null;
      if (!match) return null;
      return canViewerSeeStay(match) ? match : null;
    }

    function monthLabel(d){
      return `${DK_MONTHS[d.getMonth()]} ${d.getFullYear()}`;
    }

    function render(){
      monthName.textContent = monthLabel(view);

      const first = new Date(view.getFullYear(), view.getMonth(), 1);
      first.setHours(12,0,0,0);

      const firstMonday = mondayStart(first);
      const start = firstMonday;

      daysEl.innerHTML = "";
      for (let i=0; i<42; i++){
        const d = addDays(start, i);
        const inThisMonth = d.getMonth() === view.getMonth();

        const day = document.createElement("div");
        day.className = "day" + (inThisMonth ? "" : " muted");

        const top = document.createElement("div");
        top.className = "dayTop";

        const num = document.createElement("div");
        num.className = "num";
        num.textContent = String(d.getDate());

        const dow = document.createElement("div");
        dow.className = "dow";
        dow.textContent = DK_DOW[d.getDay()];

        top.appendChild(num);
        top.appendChild(dow);
        day.appendChild(top);

        const base = baseOwnerForDate(d);
        const visibleStay = findStayForDateVisible(d);

        if (base.type === "shift"){
          // Søndag: én pill, fuldt læsbar, farve = NEXT (den nye uge)
          const p = document.createElement("div");
          p.className = "pill shiftday " + ownerClass(base.next);
          p.textContent = `Skifte: ${base.current} → ${base.next}`;
          p.title = `Skifte: ${base.current} → ${base.next}`;
          day.appendChild(p);
        } else {
          const p = document.createElement("div");
          p.className = "pill " + ownerClass(base.owner);
          p.textContent = base.owner;

          // Hvis der findes en synlig ændring, streger vi basis-ejer over
          if (visibleStay){
            p.classList.add("strike");
            p.title = "Denne periode er ændret";
          }

          day.appendChild(p);
        }

        if (visibleStay){
          const b = document.createElement("div");
          b.className = "pill booking";
          b.textContent = `Bruges af: ${visibleStay.family}`;
          day.appendChild(b);
        }

        if (selectedStart && sameDay(d, selectedStart)) {
          day.style.outline = "2px solid rgba(45,212,122,.85)";
          day.style.outlineOffset = "2px";
        }
        if (selectedEnd && sameDay(d, selectedEnd)) {
          day.style.outline = "2px solid rgba(45,212,122,.85)";
          day.style.outlineOffset = "2px";
        }
        if (selectedStart && selectedEnd && inRange(d, selectedStart, selectedEnd)){
          day.style.borderColor = "rgba(45,212,122,.35)";
          day.style.background = "rgba(45,212,122,.08)";
        }

        if (inThisMonth){
          day.addEventListener("click", ()=> onDayClick(d));
        }

        daysEl.appendChild(day);
      }
    }

    function onDayClick(date){
      if (!selectedStart || (selectedStart && selectedEnd)){
        selectedStart = date;
        selectedEnd = null;
      } else {
        selectedEnd = date;
        [selectedStart, selectedEnd] = clampDateOrder(selectedStart, selectedEnd);
      }

      if (selectedStart) startInput.value = isoDate(selectedStart);
      if (selectedEnd) endInput.value = isoDate(selectedEnd);

      render();
    }

    /* ===== Supabase stays ===== */
    async function loadStays(){
      const client = getSupabaseClient();
      if (!client){
        setStatus("Kunne ikke forbinde lige nu. Prøv at genindlæse.", false);
        return;
      }

      const { data, error } = await client
        .from("stays")
        .select("*")
        .order("start_date", { ascending: true });

      if (error){
        setStatus("Kunne ikke hente data.", false);
        console.error(error);
        return;
      }

      stays = Array.isArray(data) ? data : [];
      render();
      renderList();
    }

    function overlapsExisting(aISO, bISO, ignoreId){
      return stays.some(s=>{
        if (ignoreId && String(s.id) === String(ignoreId)) return false;
        return !(s.end_date < aISO || s.start_date > bISO);
      });
    }

    function minStartDateISO(){
      const t = startOfDay(new Date());
      const min = addDays(t, 1);
      return isoDate(min);
    }

    let editingId = null;

    async function saveStay(){
      const s = startInput.value;
      const e = endInput.value;
      const who = (whoInput.value || "").trim();
      const changedBy = (changedByInput.value || "").trim();
      const note = (noteInput.value || "").trim();
      const vis = (visibilityInput.value || "").trim();

      if (!s || !e){
        setStatus("Vælg både start og slut.", false);
        return;
      }
      if (!who){
        setStatus("Skriv hvem der har huset.", false);
        return;
      }
      if (!changedBy){
        setStatus("Skriv hvem der har ændret.", false);
        return;
      }
      if (!vis){
        setStatus("Vælg synlighed.", false);
        return;
      }

      // Family må kun vælge egen familie eller all
      if (!isAdmin()){
        if (isFamilyRole()){
          if (!(vis === "all" || vis === getRole())){
            setStatus("Du kan kun vælge din egen familie eller ses af alle.", false);
            return;
          }
        } else {
          // shared må kun lave all
          if (vis !== "all"){
            setStatus("Du kan kun vælge ses af alle.", false);
            return;
          }
        }
      }

      const [a,b] = clampDateOrder(s, e);

      // Kan kun lave ændringer fra i morgen
      const minISO = minStartDateISO();
      if (a < minISO){
        setStatus("Du kan kun lave ændringer fra i morgen.", false);
        return;
      }

      // Ingen overlap
      if (overlapsExisting(a, b, editingId)){
        setStatus("Der findes allerede en ændring i den valgte periode. Slet den først, hvis du vil lave en ny.", false);
        return;
      }

      const client = getSupabaseClient();
      if (!client){
        setStatus("Kunne ikke forbinde.", false);
        return;
      }

      const payload = {
        start_date: a,
        end_date: b,
        family: who,
        booked_by: changedBy,
        note: note,
        visibility: vis,
        created_role: isAdmin() ? "admin" : getRole()
      };

      let res;
      if (editingId){
        // Kun hvis man må redigere
        const current = stays.find(x=>String(x.id)===String(editingId)) || null;
        if (!current){
          setStatus("Kunne ikke finde ændringen.", false);
          return;
        }
        if (!canEditOrDeleteStay(current)){
          setStatus("Du må ikke redigere denne ændring.", false);
          return;
        }

        res = await client.from("stays").update(payload).eq("id", editingId);
      } else {
        // Shared må også oprette? (du har tidligere haft adgang til at oprette via fælles kode)
        res = await client.from("stays").insert(payload);
      }

      if (res.error){
        setStatus("Kunne ikke gemme.\n" + (res.error.message || ""), false);
        console.error(res.error);
        return;
      }

      setStatus("Gemt ✅");
      resetForm(false);
      await loadStays();
    }

    async function deleteStay(id){
      const stay = stays.find(s=>String(s.id)===String(id)) || null;
      if (!stay){
        setStatus("Kunne ikke finde ændringen.", false);
        return;
      }

      if (!canEditOrDeleteStay(stay)){
        setStatus("Du må ikke slette denne ændring.", false);
        return;
      }

      openModal(
        "OBS",
        `<div style="line-height:1.35; color: rgba(255,255,255,.85);">
          Denne ændring er lavet af <b>${escapeHtml(stay.booked_by || "-")}</b>.<br><br>
          Hvis du sletter denne ændring, forsvinder den permanent og kan ikke genskabes.
        </div>`,
        [
          { text: "Nej, jeg vil ikke slette", onClick: ()=> closeModal() },
          { text: "Ja, jeg vil slette ændringen", danger:true, primary:true, onClick: async ()=>{
              closeModal();
              const client = getSupabaseClient();
              if (!client){
                setStatus("Kunne ikke forbinde.", false);
                return;
              }
              const { error } = await client.from("stays").delete().eq("id", id);
              if (error){
                setStatus("Kunne ikke slette.\n" + (error.message || ""), false);
                console.error(error);
                return;
              }
              setStatus("Slettet");
              await loadStays();
          }}
        ]
      );
    }

    function resetForm(clearSelection=true){
      startInput.value = "";
      endInput.value = "";
      whoInput.value = "";
      changedByInput.value = "";
      noteInput.value = "";
      visibilityInput.value = "";
      editingId = null;
      saveBtn.textContent = "Gem";

      if (clearSelection){
        selectedStart = null;
        selectedEnd = null;
        render();
      }
    }

    function escapeHtml(s){
      return String(s || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function renderList(){
      listEl.innerHTML = "";

      const viewer = getViewerRoleForVisibility();

      // filtrér synlige
      const visible = stays.filter(s=> canViewerSeeStay(s));

      // split fremtid/historik
      const future = visible.filter(s=> !isHistorical(s));
      const past = visible.filter(s=> isHistorical(s));

      const sortedFuture = [...future].sort((a,b)=> (a.start_date || "").localeCompare(b.start_date || ""));
      const sortedPast = [...past].sort((a,b)=>{
        const aa = (a.created_at || "");
        const bb = (b.created_at || "");
        return bb.localeCompare(aa);
      });

      const showPastList = showHistory;

      if (!sortedFuture.length && (!showPastList || !sortedPast.length)){
        const empty = document.createElement("div");
        empty.className = "item";
        empty.innerHTML = `<div class="meta"><div class="who">Ingen ændringer endnu</div><div class="dates">—</div></div>`;
        listEl.appendChild(empty);
        return;
      }

      function addStayItem(s){
        const it = document.createElement("div");
        it.className = "item";

        const meta = document.createElement("div");
        meta.className = "meta";

        const who = document.createElement("div");
        who.className = "who";
        who.textContent = s.family || "(ukendt)";

        const dates = document.createElement("div");
        dates.className = "dates";
        dates.textContent = `${s.start_date} → ${s.end_date}`;

        const by = document.createElement("div");
        by.className = "by";
        by.textContent = `Ændret af: ${s.booked_by || "-"}`;

        const vis = document.createElement("div");
        vis.className = "by";
        const visText = (s.visibility === "all" || !s.visibility) ? "alle" : ("kun " + s.visibility);
        vis.textContent = `Synlig: ${visText}`;

        meta.appendChild(who);
        meta.appendChild(dates);
        meta.appendChild(by);
        meta.appendChild(vis);

        if (s.note && String(s.note).trim()){
          const note = document.createElement("div");
          note.className = "note";
          note.textContent = `Note: ${String(s.note).trim()}`;
          meta.appendChild(note);
        }

        const btns = document.createElement("div");
        btns.className = "btnRow";

        const canChange = canEditOrDeleteStay(s);

        if (canChange){
          const edit = document.createElement("button");
          edit.className = "btn";
          edit.type = "button";
          edit.textContent = "Rediger";
          edit.addEventListener("click", ()=> beginEdit(s));
          btns.appendChild(edit);

          const del = document.createElement("button");
          del.className = "btn danger";
          del.type = "button";
          del.textContent = "Slet";
          del.addEventListener("click", ()=> deleteStay(s.id));
          btns.appendChild(del);
        }

        it.appendChild(meta);
        it.appendChild(btns);

        listEl.appendChild(it);
      }

      sortedFuture.forEach(addStayItem);

      if (showPastList){
        sortedPast.forEach(addStayItem);
      }
    }

    function beginEdit(stay){
      if (!stay) return;
      if (!canEditOrDeleteStay(stay)){
        setStatus("Du må ikke redigere denne ændring.", false);
        return;
      }

      editingId = stay.id;
      saveBtn.textContent = "Opdater";

      startInput.value = stay.start_date || "";
      endInput.value = stay.end_date || "";
      whoInput.value = stay.family || "";
      changedByInput.value = stay.booked_by || "";
      noteInput.value = stay.note || "";
      visibilityInput.value = stay.visibility || "all";

      setStatus("Redigering slået til");
    }

    toggleHistoryBtn.addEventListener("click", ()=>{
      showHistory = !showHistory;
      toggleHistoryBtn.textContent = showHistory ? "Skjul historiske ændringer" : "Vis historiske ændringer";
      renderList();
    });

    prevBtn.addEventListener("click", ()=>{
      view = new Date(view.getFullYear(), view.getMonth()-1, 1);
      view.setHours(12,0,0,0);
      render();
    });
    nextBtn.addEventListener("click", ()=>{
      view = new Date(view.getFullYear(), view.getMonth()+1, 1);
      view.setHours(12,0,0,0);
      render();
    });
    todayBtn.addEventListener("click", ()=>{
      view = new Date();
      view.setHours(12,0,0,0);
      render();
    });

    resetBtn.addEventListener("click", ()=> resetForm(true));
    saveBtn.addEventListener("click", saveStay);

    /* ===== Yderligere info (UI-lås, gemmes lokalt) ===== */
    const EXTRA_KEY = "samsoehuset_extra_items_v1";

    function getExtraItems(){
      try{
        const raw = localStorage.getItem(EXTRA_KEY);
        const arr = raw ? JSON.parse(raw) : [];
        return Array.isArray(arr) ? arr : [];
      }catch(e){
        return [];
      }
    }
    function setExtraItems(items){
      localStorage.setItem(EXTRA_KEY, JSON.stringify(items || []));
    }

    function buildExtraMenu(){
      extraMenu.innerHTML = "";

      const items = getExtraItems();

      if (!items.length){
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = "Ingen punkter endnu";
        b.disabled = true;
        b.style.opacity = ".7";
        extraMenu.appendChild(b);
      } else {
        items.forEach((it, idx)=>{
          const b = document.createElement("button");
          b.type = "button";
          b.textContent = it.title || ("Punkt " + (idx+1));
          b.addEventListener("click", ()=>{
            extraMenu.classList.remove("show");
            openExtraView(it);
          });
          extraMenu.appendChild(b);
        });
      }

      extraMenu.appendChild(document.createElement("div")).className = "sep";

      if (isAdmin()){
        const add = document.createElement("button");
        add.type = "button";
        add.textContent = "Tilføj nyt punkt";
        add.addEventListener("click", ()=>{
          extraMenu.classList.remove("show");
          openExtraEditor(null, null);
        });
        extraMenu.appendChild(add);

        const manage = document.createElement("button");
        manage.type = "button";
        manage.textContent = "Administrer punkter";
        manage.addEventListener("click", ()=>{
          extraMenu.classList.remove("show");
          openExtraManager();
        });
        extraMenu.appendChild(manage);
      }
    }

    function openExtraView(item){
      const wrap = document.createElement("div");
      wrap.style.display = "flex";
      wrap.style.flexDirection = "column";
      wrap.style.gap = "10px";

      const t = document.createElement("div");
      t.style.fontWeight = "850";
      t.style.fontSize = "18px";
      t.textContent = item.title || "—";

      const c = document.createElement("div");
      c.style.whiteSpace = "pre-wrap";
      c.style.color = "rgba(255,255,255,.82)";
      c.textContent = item.content || "";

      wrap.appendChild(t);
      wrap.appendChild(c);

      const btns = [{ text:"Luk", onClick: ()=> closeModal(), primary:true }];

      if (isAdmin()){
        btns.unshift({ text:"Rediger", onClick: ()=>{
          closeModal();
          openExtraEditor(item, getExtraItems());
        }});
      }

      openModal("Yderligere info", wrap, btns);
    }

    function openExtraEditor(item, itemsSnapshot){
      if (!isAdmin()){
        setStatus("Kun administrator kan redigere.", false);
        return;
      }

      const items = itemsSnapshot || getExtraItems();

      const isEdit = !!item;
      const idx = isEdit ? items.findIndex(x=>x.id===item.id) : -1;

      const wrap = document.createElement("div");
      wrap.style.display = "flex";
      wrap.style.flexDirection = "column";
      wrap.style.gap = "10px";

      const title = document.createElement("input");
      title.className = "field";
      title.placeholder = "Titel";
      title.value = item ? (item.title || "") : "";

      const content = document.createElement("textarea");
      content.className = "field";
      content.placeholder = "Indhold";
      content.style.minHeight = "140px";
      content.value = item ? (item.content || "") : "";

      wrap.appendChild(title);
      wrap.appendChild(content);

      openModal(
        isEdit ? "Rediger punkt" : "Tilføj punkt",
        wrap,
        [
          { text:"Annuller", onClick: ()=> closeModal() },
          { text: isEdit ? "Gem" : "Tilføj", primary:true, onClick: ()=>{
              const t = (title.value || "").trim();
              const c = (content.value || "").trim();

              if (!t){
                setStatus("Skriv en titel.", false);
                return;
              }

              if (isEdit && idx >= 0){
                items[idx] = { ...items[idx], title: t, content: c };
              } else {
                items.unshift({ id: "x_"+Date.now(), title: t, content: c });
              }
              setExtraItems(items);
              buildExtraMenu();
              closeModal();
              setStatus("Gemt ✅");
          }}
        ]
      );
    }

    function openExtraManager(){
      if (!isAdmin()){
        setStatus("Kun administrator kan administrere.", false);
        return;
      }

      const items = getExtraItems();

      const wrap = document.createElement("div");
      wrap.style.display = "flex";
      wrap.style.flexDirection = "column";
      wrap.style.gap = "10px";

      if (!items.length){
        const d = document.createElement("div");
        d.style.color = "rgba(255,255,255,.75)";
        d.textContent = "Ingen punkter endnu.";
        wrap.appendChild(d);
      } else {
        items.forEach(it=>{
          const row = document.createElement("div");
          row.style.display = "flex";
          row.style.justifyContent = "space-between";
          row.style.alignItems = "center";
          row.style.gap = "10px";
          row.style.border = "1px solid rgba(255,255,255,.10)";
          row.style.background = "rgba(255,255,255,.05)";
          row.style.borderRadius = "14px";
          row.style.padding = "10px";

          const t = document.createElement("div");
          t.style.fontWeight = "800";
          t.style.minWidth = "0";
          t.style.overflow = "hidden";
          t.style.textOverflow = "ellipsis";
          t.style.whiteSpace = "nowrap";
          t.textContent = it.title || "—";

          const btnRow = document.createElement("div");
          btnRow.style.display = "flex";
          btnRow.style.gap = "8px";

          const e = document.createElement("button");
          e.className = "btn";
          e.type = "button";
          e.textContent = "Rediger";
          e.addEventListener("click", ()=>{
            closeModal();
            openExtraEditor(it, items);
          });

          const del = document.createElement("button");
          del.className = "btn danger";
          del.type = "button";
          del.textContent = "Slet";
          del.addEventListener("click", ()=>{
            openModal(
              "OBS",
              `<div style="line-height:1.35; color: rgba(255,255,255,.85);">
                Hvis du sletter dette punkt, forsvinder det permanent og kan ikke genskabes.
              </div>`,
              [
                { text:"Nej", onClick: ()=> closeModal() },
                { text:"Ja, slet", primary:true, danger:true, onClick: ()=>{
                    const left = getExtraItems().filter(x=>x.id !== it.id);
                    setExtraItems(left);
                    buildExtraMenu();
                    closeModal();
                    openExtraManager();
                }}
              ]
            );
          });

          btnRow.appendChild(e);
          btnRow.appendChild(del);

          row.appendChild(t);
          row.appendChild(btnRow);

          wrap.appendChild(row);
        });
      }

      openModal("Administrer punkter", wrap, [{ text:"Luk", primary:true, onClick: ()=> closeModal() }]);
    }

    extraBtn.addEventListener("click", (e)=>{
      e.stopPropagation();
      extraMenu.classList.toggle("show");
    });
    document.addEventListener("click", ()=>{
      extraMenu.classList.remove("show");
    });

    /* ===== Init ===== */
    (function init(){
      if (isLoggedIn()){
        showApp();
        applyRoleUI();
        loadStays();
      } else {
        showLogin();
      }

      render();
      renderList();
    })();
  </script>
</body>
</html>
