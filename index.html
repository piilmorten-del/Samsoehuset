<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Samsøhuset</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: #fff;
    }

    body {
      background: linear-gradient(135deg, #000, #111);
      overflow-x: hidden;
    }

    .lock {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.85);
      z-index: 9999;
    }

    .lockBox {
      width: min(420px, 100%);
      padding: 24px;
      border-radius: 16px;
      background: rgba(20,20,20,0.95);
      border: 1px solid rgba(255,255,255,0.2);
      text-align: center;
    }

    .lockBox h2 {
      margin: 0 0 10px;
    }

    .lockBox p {
      color: #ccc;
      margin-bottom: 16px;
    }

    .lockBox input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      margin-bottom: 12px;
      font-size: 16px;
    }

    .lockBox button {
      padding: 12px 20px;
      border-radius: 10px;
      border: none;
      background: #22c55e;
      color: #000;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
    }

    .lockMsg {
      margin-top: 10px;
      min-height: 18px;
      color: #ff8080;
      font-size: 14px;
    }

    .hidden {
      display: none;
    }

    .app {
      padding: 24px;
      max-width: 1100px;
      margin: 0 auto;
    }
  </style>
</head>

<body>

<!-- 🔒 LOGIN -->
<div id="lock" class="lock">
  <div class="lockBox">
    <h2>Samsøhuset</h2>
    <p>Indtast koden for at se kalenderen</p>
    <input id="passInput" type="password" placeholder="Kode" />
    <button id="unlockBtn">Lås op</button>
    <div id="lockMsg" class="lockMsg"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="app hidden">
  <h1>Samsøhuset</h1>
  <p>Login virker nu 🎉</p>
</div>

<script>
  /* ===== LOGIN-KONFIGURATION ===== */
  const SHARED_CODE = "kalkhavesvej";

  const lock = document.getElementById("lock");
  const app = document.getElementById("app");
  const passInput = document.getElementById("passInput");
  const unlockBtn = document.getElementById("unlockBtn");
  const lockMsg = document.getElementById("lockMsg");

  function normalize(value) {
    return (value || "").trim().toLowerCase();
  }

  function unlock() {
    localStorage.setItem("samsoehuset_ok", "1");
    lock.classList.add("hidden");
    app.classList.remove("hidden");
  }

  function isUnlocked() {
    return localStorage.getItem("samsoehuset_ok") === "1";
  }

  function tryUnlock() {
    const entered = normalize(passInput.value);
    const correct = normalize(SHARED_CODE);

    if (entered === correct) {
      unlock();
    } else {
      lockMsg.textContent = "Forkert kode – prøv igen";
    }
  }

  unlockBtn.addEventListener("click", tryUnlock);
  passInput.addEventListener("keydown", e => {
    if (e.key === "Enter") tryUnlock();
  });

  if (isUnlocked()) {
    unlock();
  }
</script>

</body>
</html>
