<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Samsøhuset</title>
  <style>
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
    body{
      background:#0b0b0b;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      padding:24px;
    }
    .box{
      width:min(520px,100%);
      background:rgba(20,24,28,.55);
      border:1px solid rgba(255,255,255,.18);
      border-radius:18px;
      padding:18px;
      box-shadow:0 20px 50px rgba(0,0,0,.45);
    }
    h1{margin:0 0 6px;font-size:24px;}
    .muted{opacity:.75;margin-bottom:12px;}
    .row{display:flex;gap:10px;}
    input,button{
      font-size:16px;
      padding:12px 14px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.06);
      color:#fff;
    }
    input{flex:1;}
    button{
      cursor:pointer;
      font-weight:900;
      background:rgba(34,197,94,.25);
      border-color:rgba(34,197,94,.6);
    }
    .msg{margin-top:12px;min-height:18px;}
    .ok{
      margin-top:12px;
      padding:12px 14px;
      border-radius:12px;
      background:rgba(34,197,94,.18);
      border:1px solid rgba(34,197,94,.6);
    }
  </style>
</head>
<body>

<div class="box">
  <h1>Samsøhuset</h1>
  <div class="muted">Indtast koden for at komme ind</div>

  <div class="row">
    <input id="code" type="password" placeholder="Kode">
    <button id="btn">Lås op</button>
  </div>

  <div id="msg" class="msg"></div>
  <div id="ok" class="ok" style="display:none;">
    Login virker – her kan kalenderen ligge ✅
  </div>
</div>

<script>
  const KODE = "kalkhavesvej";

  const code = document.getElementById("code");
  const btn = document.getElementById("btn");
  const msg = document.getElementById("msg");
  const ok = document.getElementById("ok");

  function norm(v){ return (v||"").trim().toLowerCase(); }

  function unlock(){
    if(norm(code.value) === norm(KODE)){
      msg.textContent = "Korrekt kode 🎉";
      ok.style.display = "block";
    }else{
      msg.textContent = "Forkert kode – prøv igen";
      ok.style.display = "none";
    }
  }

  btn.onclick = unlock;
  code.onkeydown = e => { if(e.key==="Enter") unlock(); };
</script>

</body>
</html>
